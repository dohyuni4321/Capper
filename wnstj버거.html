<style>
/* Layout: full-screen first-person view; slim HUD on top, crosshair + prompt in the middle, held item and tray at the bottom. */
:root{
  --red:#e1262d; --red2:#b81a20; --yellow:#ffc42e; --cream:#fff6dc; --ink:#2b1a14; --mute:#7a655a; --white:#ffffff; --green:#1f9d3f;
  --panel:rgba(255,246,220,.94); --line:rgba(43,26,20,.18);
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#bfe3ff;color:var(--ink);font-family:var(--f-body)}
body{-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#bfe3ff}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}

.bubble{--bw:clamp(108px,16vw,142px);position:absolute;left:0;top:0;width:var(--bw);background:var(--cream);color:var(--ink);padding:0 9px 9px;border-radius:4px;font-size:12px;line-height:1.25;box-shadow:0 4px 0 rgba(0,0,0,.25);border-top:6px solid var(--red);will-change:transform}
.bubble.match{outline:3px solid var(--green);box-shadow:0 0 0 6px rgba(31,157,63,.28),0 4px 0 rgba(0,0,0,.25)}
.bt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-bottom:1px dashed var(--line);padding:6px 0 5px}
.bt b{font-size:13px}
.bt em{font-style:normal;font-size:11px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.stk,.ext{display:flex;gap:2px;margin-top:6px}
.stk{flex-direction:column}
.ext{flex-wrap:wrap}
.chip{--c:#444;--tc:#fff;display:inline-block;background:var(--c);color:var(--tc);padding:2px 8px;border-radius:3px;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap}
.stk .chip{display:block;text-align:center}
.say{position:absolute;left:0;top:0;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap;pointer-events:none;will-change:transform;z-index:4}
.bubble.jerk{border-top-color:#7a0f14}
.jerk-tag{margin:0 -9px;background:#7a0f14;color:#fff;font-weight:700;font-size:11px;padding:2px 9px;line-height:1.3}
.pat{height:5px;background:rgba(43,26,20,.14);margin-top:8px;border-radius:2px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--green);transform-origin:left center}
.pat.low i{background:var(--red)}

.pop{position:absolute;left:0;top:0;font-family:var(--f-display);font-size:26px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.55);animation:rise 1.2s ease-out forwards;z-index:5}
.pop.good{color:var(--yellow)}
.pop.bad{color:#ff6b6b}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-80px}}
@media (prefers-reduced-motion:reduce){@keyframes rise{from{opacity:1}to{opacity:0}}}

.hud{position:absolute;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:5px 11px;pointer-events:auto;min-width:0}
.brand{background:var(--red);color:var(--yellow);border-color:var(--red2);display:flex;flex-direction:column;justify-content:center}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1}
.brand span{font-size:11px;color:#fff;margin-top:3px}
.stat small{display:block;font-size:10px;letter-spacing:.08em;color:var(--mute)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .of{font-size:11px;color:var(--mute)}
.meter{height:5px;background:rgba(43,26,20,.14);margin-top:3px;border-radius:2px;overflow:hidden;min-width:110px}
.meter i{display:block;height:100%;background:var(--green);transform-origin:left center;transform:scaleX(0)}
.meter.full i{background:var(--red)}
.pips{display:flex;gap:4px;padding-top:6px}
.pip{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);background:rgba(43,26,20,.16)}
.pip.on{background:var(--red)}
.spacer{flex:1}
.btn{background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:4px;padding:10px 20px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:hover{background:var(--red2)}
.btn:focus-visible,.ghost:focus-visible,.tb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ghost{background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:5px 11px;font-size:12px;cursor:pointer;pointer-events:auto}
.ghost:hover{background:#fff}
.tools{display:flex;gap:6px;align-items:stretch}

#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.7)}
#cross::before{left:8px;top:0;width:2px;height:18px;opacity:.0}
#cross::after{left:0;top:8px;width:18px;height:2px;opacity:.0}
#cross i{position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.75)}
#cross.on i{background:var(--yellow);transform:scale(1.5)}
#prompt{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);max-width:90%;background:rgba(43,26,20,.88);color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:3px;white-space:nowrap;pointer-events:none;opacity:0}
#prompt.on{opacity:1}
#prompt kbd{background:var(--yellow);color:var(--ink);border-radius:3px;padding:0 6px;margin-right:6px;font-family:var(--f-body)}

.foot{display:flex;flex-direction:column;align-items:center;gap:8px}
#toast{min-height:30px;padding:5px 14px;background:var(--ink);color:#fff;border-radius:4px;font-size:13px;opacity:0;transition:opacity .15s;text-align:center;max-width:100%}
#toast.on{opacity:1}
.dock{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dock .lbl{font-family:var(--f-display);font-size:14px;color:var(--red);margin-right:8px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.chips .empty{font-size:12px;color:var(--mute)}
.hotbar{display:flex;gap:6px;pointer-events:auto}
.slot{position:relative;width:clamp(52px,8.5vw,84px);height:52px;background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:3px 3px 8px;font-size:11px;font-weight:700;line-height:1.2;text-align:center;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.slot i{position:absolute;left:4px;top:1px;font-style:normal;font-size:10px;color:var(--mute)}
.slot span{display:block;min-width:0;overflow-wrap:anywhere}
.slot .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c,transparent)}
.slot.sel{outline:3px solid var(--yellow);outline-offset:1px;background:#fff}
.slot:focus-visible{outline:3px solid var(--ink)}
.comp.done{opacity:.4;text-decoration:line-through}
.hint{font-size:11px;color:var(--mute);margin-top:4px}

#touch{position:absolute;inset:0;z-index:4;pointer-events:none}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,246,220,.45);border:2px solid rgba(43,26,20,.5);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
#tbtns{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);gap:6px;pointer-events:auto}
.tb{height:50px;border-radius:50%;width:64px;background:var(--panel);border:2px solid var(--ink);font-weight:700;font-size:13px;touch-action:none}
.tb.big{background:var(--red);color:#fff}

#overlay{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(255,196,46,.55);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:min(600px,100%);max-height:100%;overflow:auto;background:var(--cream);border:3px solid var(--ink);border-radius:6px;padding:22px 22px 20px;box-shadow:0 8px 0 var(--ink);touch-action:pan-y}
.panel h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,8vw,50px);line-height:1;margin:0 0 8px;color:var(--red);text-wrap:balance}
.panel .sub{color:var(--mute);margin:0 0 16px;line-height:1.55;font-size:14px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:0 0 16px;padding:0;list-style:none;font-size:13px;line-height:1.4}
.keys li{display:flex;gap:8px;align-items:baseline;min-width:0}
.keys kbd{flex:none;background:var(--ink);color:var(--yellow);border-radius:3px;padding:1px 7px;font-size:12px;font-family:var(--f-body);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 16px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.sum dt{font-size:11px;color:var(--mute)}
.sum dd{margin:2px 0 0;font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px;margin:0 0 14px}
.stars svg{width:34px;height:34px;fill:rgba(43,26,20,.15)}
.stars svg.on{fill:var(--yellow);stroke:var(--ink);stroke-width:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.keys{grid-template-columns:1fr}.stat b{font-size:18px}.brand b{font-size:17px}.card{padding:4px 8px}}
</style>

<div id="app">
  <div id="stage"></div>
  <div id="bubbles"></div>
  <div class="hud">
    <header class="bar">
      <div class="card brand"><b>wnstj 버거</b><span id="dayLbl">1일차</span></div>
      <div class="card stat"><small>오늘 매출</small><b id="money">0원</b><div class="meter"><i id="goalBar"></i></div><span class="of" id="goalTxt">목표 0원</span></div>

      <div class="card stat"><small>포만감</small><b id="fullTxt">0%</b><div class="meter" id="fullM"><i id="fullBar"></i></div></div>

  </div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var rnd=function(a){return a[Math.floor(Math.random()*a.length)];};
var won=function(n){return Math.round(n).toLocaleString('ko-KR')+'원';};
var reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var isTouch=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);

/* ---------- game data ---------- */
var ING={
  bun:{name:'빵',color:'#e3a857',tc:'#2a1a05'},
  patty:{name:'패티',color:'#6e3b1f',tc:'#ffffff'},
  cheese:{name:'치즈',color:'#ffc933',tc:'#2a2000'},
  lettuce:{name:'양상추',color:'#78cf55',tc:'#0f2a05'},
  tomato:{name:'토마토',color:'#e5412d',tc:'#ffffff'}
};
var DRINKS={cola:{name:'콜라',color:'#4a2a1a',tc:'#ffffff'},orange:{name:'오렌지',color:'#ff9a1f',tc:'#2a1500'}};
var MENU=[
  {id:'classic',name:'클래식 버거',layers:['bun','patty','lettuce','tomato','bun'],price:4500},
  {id:'cheese',name:'치즈버거',layers:['bun','patty','cheese','bun'],price:5000},
  {id:'garden',name:'가든 버거',layers:['bun','cheese','lettuce','tomato','bun'],price:4000},
  {id:'double',name:'더블 치즈',layers:['bun','patty','patty','cheese','bun'],price:7000}
];
var FRIES_PRICE=2500, DRINK_PRICE=2000;
var COOK_RAW=5, COOK_BURN=11, FRY_RAW=5, FRY_BURN=11;
var JERK_THROW=1500, JERK_PAN=2500, THROW_BONUS=1000, JERK_HITS=3;
var SLOT_X=[-6,0,6], SLOT_Z=8.4;

function cfgFor(day){
  var menu=['classic','cheese'];
  if(day>=3) menu.push('garden');
  if(day>=4) menu.push('double');
  return {
    dur:120,
    spawnMin:Math.max(6,12-day*0.8), spawnMax:Math.max(10,18-day*1.0),
    patience:Math.max(40,70-day*3.5),
    goal:12000+day*4500,
    menu:menu,
    fries:day>=2?0.5:0,
    drink:day>=3?0.45:0
  };
}
function orderPrice(o){return (o.burger?o.burger.price:0)+(o.fries?FRIES_PRICE:0)+(o.drink?DRINK_PRICE:0);}

var S={phase:'menu',day:1,bank:0,dayMoney:0,left:120,rep:10,served:0,missed:0,combo:0,bestCombo:0,spawnT:1,cfg:cfgFor(1),cust:[],full:0,boost:0,hits:0,sandbox:false};
var tray={stack:[],fries:false,drink:null};
var inv=[null,null,null,null,null,null], sel=0; // hotbar: items are {type:...}, see itemName()

/* ---------- audio ---------- */
var actx=null, muted=false, noiseBuf=null;
function ensureAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}
}
function tone(f,d,type,v,slide,delay){
  if(!actx||muted) return;
  var t=actx.currentTime+(delay||0);
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v||0.06,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+d+0.03);
}
function noise(d,v){
  if(!actx||muted) return;
  if(!noiseBuf){
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
    var a=noiseBuf.getChannelData(0); for(var i=0;i<a.length;i++) a[i]=Math.random()*2-1;
  }
  var s=actx.createBufferSource(), g=actx.createGain(), f=actx.createBiquadFilter();
  s.buffer=noiseBuf; f.type='highpass'; f.frequency.value=1800;
  g.gain.setValueAtTime(v||0.05,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
  s.connect(f); f.connect(g); g.connect(actx.destination);
  s.start(); s.stop(actx.currentTime+d+0.02);
}
var sfx={
  click:function(){tone(520,0.06,'triangle',0.05);},
  place:function(){tone(300,0.09,'square',0.035,-80);},
  pick:function(){tone(620,0.07,'triangle',0.06);tone(820,0.08,'triangle',0.05,0,0.06);},
  ding:function(){tone(1180,0.12,'sine',0.05);},
  no:function(){tone(180,0.18,'sawtooth',0.04,-60);},
  ok:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.14,'triangle',0.06,0,i*0.07);});},
  bad:function(){tone(220,0.25,'sawtooth',0.05,-120);tone(160,0.3,'sawtooth',0.05,-80,0.15);},
  door:function(){tone(880,0.1,'sine',0.04);tone(660,0.12,'sine',0.04,0,0.09);},
  swing:function(){noise(0.14,0.05);tone(300,0.12,'sine',0.03,-150);},
  whack:function(){tone(140,0.16,'square',0.09,-80);tone(900,0.05,'triangle',0.06);},
  throwS:function(){noise(0.1,0.04);tone(420,0.1,'sine',0.03,-200);},
  splat:function(){tone(160,0.14,'sawtooth',0.05,-90);},
  bite:function(){tone(260,0.05,'square',0.05,-60);tone(220,0.06,'square',0.05,-60,0.07);},
  sip:function(){tone(700,0.07,'sine',0.04,-300);tone(520,0.07,'sine',0.04,-200,0.09);},
  spray:function(){noise(0.09,0.03);}
};

/* ---------- ui helpers ---------- */
var toastT=0;
function toast(msg){
  var el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('on');},2000);
}
function fatal(msg){
  $('#overlay').hidden=false;
  $('#panel').innerHTML='<h1>wnstj 버거</h1><p class="sub">'+msg+'</p>';
}
function starsSVG(n){
  var h='<div class="stars">';
  for(var i=0;i<3;i++) h+='<svg viewBox="0 0 24 24" class="'+(i<n?'on':'')+'" aria-hidden="true"><polygon points="12,2 15.1,8.6 22,9.3 16.8,14 18.4,21 12,17.3 5.6,21 7.2,14 2,9.3 8.9,8.6"/></svg>';
  return h+'</div>';
}
function layerName(t,i){ if(t==='bun') return i===0?'아래 빵':'위 빵'; return ING[t].name; }
function chipHTML(name,c,tc){return '<span class="chip" style="--c:'+c+';--tc:'+tc+'">'+name+'</span>';}

/* ---------- boot ---------- */
var fontsReady=(document.fonts&&document.fonts.load)?Promise.race([
  Promise.all([
    document.fonts.load('400 40px "Black Han Sans"','wnstj버거메뉴클래식치즈가든더블감자튀김콜라오렌지0123456789,'),
    document.fonts.load('700 20px "Noto Sans KR"','가')
  ]),
  new Promise(function(r){setTimeout(r,2500);})
]):Promise.resolve();
fontsReady.then(init,init);

function init(){
  if(typeof THREE==='undefined'){fatal('3D 엔진을 불러오지 못했어요. 네트워크를 확인하고 새로고침해 주세요.');return;}
  var renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true});}
  catch(e){fatal('이 브라우저에서는 WebGL을 사용할 수 없어요.');return;}

  var stage=$('#stage'), bubblesEl=$('#bubbles'), appEl=$('#app');
  var W=1,H=1;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;

  function puff(x,y,z,col,sz,vx,vy,vz,life){
    for(var i=0;i<puffs.length;i++){

      if(p.life<=0){
        p.life=p.max=life||(0.9+Math.random()*0.5); p.vy=(vy===undefined?1.1+Math.random()*0.8:vy); p.vx=vx||0; p.vz=vz||0; p.sz=sz||1;

  function updPuffs(dt){
    for(var i=0;i<puffs.length;i++){
      var p=puffs[i]; if(p.life<=0) continue;
      p.life-=dt;
      if(p.life<=0){p.m.visible=false;continue;}
      var k=p.life/p.max;
      p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt;
      p.m.scale.setScalar((1.8-k)*p.sz); p.m.material.opacity=k*0.6;
    }
  }

  /* ---------- grill / fryer progress ---------- */
  var C_PAT=[COL.raw,COL.cooked,COL.burnt], C_FRY=[COL.fRaw,COL.fGood,COL.fBurnt];
  function stepStation(st,RAW,BURN,cols,dt){
    for(var i=0;i<st.slots.length;i++){
      var s=st.slots[i], v=st.vis[i];
      if(s.state==='empty'){v.item.visible=false;v.ring.visible=false;v.slot.visible=true;continue;}
      s.t+=dt; v.slot.visible=false; v.item.visible=true;
      if(s.t<RAW) tmpC.copy(cols[0]).lerp(cols[1],s.t/RAW);
      else if(s.t<BURN) tmpC.copy(cols[1]);
      else tmpC.copy(cols[1]).lerp(cols[2],Math.min(1,(s.t-BURN)/2.5));
      v.mat.color.copy(tmpC);
      var m=v.ring.material; v.ring.visible=true;
      if(s.t<RAW){m.color.set('#ffffff');m.opacity=0.7;v.ring.scale.setScalar(0.5+0.5*(s.t/RAW));}
      else if(s.t<BURN){
        var warn=s.t>BURN-2.5;
        m.color.set(warn?'#e1262d':'#1f9d3f');
        m.opacity=0.75+0.25*Math.sin(performance.now()/(warn?70:170));
        v.ring.scale.setScalar(1);
      }else v.ring.visible=false;
      if(!s.dinged&&s.t>=RAW){s.dinged=true;sfx.ding();}
      s.puff-=dt;
      if(s.puff<=0&&s.t>0.8){
        var burnt=s.t>BURN;
        s.puff=burnt?0.16:0.4+Math.random()*0.2;
        puff(v.wp.x,v.wp.y,v.wp.z,burnt?'#3a3340':'#ffffff',burnt?1.3:0.8);
      }
    }
  }

  function placeSay(c){
    _bv.set(c.g.position.x,2.6+c.y+(c.sit?-0.16:0),c.g.position.z).project(camera);
    if(_bv.z>1||Math.abs(_bv.x)>1.1||Math.abs(_bv.y)>1.1){c.sayEl.style.visibility='hidden';return;}
    c.sayEl.style.visibility='visible';
    c.sayEl.style.transform='translate('+Math.round((_bv.x*0.5+0.5)*W)+'px,'+Math.round((-_bv.y*0.5+0.5)*H)+'px) translate(-50%,-100%)';
  }

  /* ---------- serving, hits and money ---------- */
  function gain(amount){S.dayMoney+=amount;S.bank+=amount;}
  function loseRep(missed){
    if(S.sandbox) return;
    S.rep--; S.combo=0; if(missed) S.missed++; updHUD(); checkOver();
  }
  function allGot(c){
    var o=c.order;
    return (!o.burger||c.got.burger)&&(!o.fries||c.got.fries)&&(!o.drink||c.got.drink);
  }
  function no(msg,bad){return {ok:false,msg:msg,bad:!!bad};}
  function deliverCheck(c,it){
    var o=c.order, got=c.got;
    if(it.eaten) return no('먹다 남은 건 못 받아요!',true);
    if(it.type==='burger'){
      if(!o.burger) return no('버거는 주문하지 않았어요.',true);
      if(got.burger) return no('버거는 이미 받았어요.');
      var w=o.burger.layers, s=it.stack, same=w.length===s.length;
      for(var i=0;same&&i<w.length;i++) if(w[i]!==s[i]) same=false;
      return same?{ok:true,key:'burger'}:no('버거 재료가 주문과 달라요.',true);
    }
    if(it.type==='fries'){
      if(!o.fries) return no('감자튀김은 주문하지 않았어요.',true);
      if(got.fries) return no('감자튀김은 이미 받았어요.');
      return it.q==='cooked'?{ok:true,key:'fries'}:no('탄 감자튀김은 싫어요.',true);
    }
    if(it.type==='drink'){
      if(!o.drink) return no('음료는 주문하지 않았어요.',true);
      if(got.drink) return no('음료는 이미 받았어요.');
      return it.flavor===o.drink?{ok:true,key:'drink'}:no('다른 음료예요.',true);
    }
    return no('이건 주문에 없어요.',true);
  }
  function markBubble(c,key){
    var el=c.bubble&&c.bubble.querySelector('[data-k="'+key+'"]');
    if(el) el.classList.add('done');
  }
  function tryDeliver(c,it,thrown){
    var r=deliverCheck(c,it);
    if(!r.ok){if(!thrown){toast(r.msg);sfx.no();if(r.bad) spit(c);}return false;}
    c.got[r.key]=true; if(thrown) c.thrownAny=true;
    markBubble(c,r.key); sfx.pick();
    if(allGot(c)) completeOrder(c,c.thrownAny);
    else pop('받았어요 ✓','good',c.g.position.x,2.9+c.y,c.g.position.z);
    return true;
  }
  // wrong food: the customer spits and reputation drops a little
  function spit(c){
    c.wrong++;
    say(c,'퉤!',1.8);
    var dx=P.x-c.g.position.x, dz=P.z-c.g.position.z, d=Math.hypot(dx,dz)||1;
    for(var i=0;i<7;i++) puff(c.g.position.x,1.95,c.g.position.z,'#d4e07a',0.4,dx/d*(4+Math.random()*2)+(Math.random()-0.5),1+Math.random(),dz/d*(4+Math.random()*2)+(Math.random()-0.5),0.5);
    sfx.bad();
    var px_=c.g.position.x, pz_=c.g.position.z;
    if(c.wrong>=3){pop('못 먹겠어!','bad',px_,3.2,pz_);leave(c,false);}
    loseRep(false);
  }
  function completeOrder(c,thrown){
    var total=orderPrice(c.order), frac=Math.max(0,c.patience/c.max);
    S.combo++; S.bestCombo=Math.max(S.bestCombo,S.combo);
    c.tip=Math.round((total*0.4*frac+total*0.05*Math.min(S.combo-1,6))/100)*100;
    var amt=total+(thrown?THROW_BONUS:0);
    gain(amt); S.served++;
    var px_=c.g.position.x, pz_=c.g.position.z;
    pop('+'+won(amt),'good',px_,2.9,pz_);
    if(thrown) setTimeout(function(){pop('던져서 배달!','good',px_,3.5,pz_);},120);
    else if(S.combo>=2) setTimeout(function(){pop(S.combo+'연속!','good',px_,3.5,pz_);},120);
    sfx.ok(); updHUD();
    var seat=freeSeat();
    if(!seat){gain(c.tip);if(c.tip>0)pop('팁 +'+won(c.tip),'good',px_,3.3,pz_);updHUD();leave(c,true);return;}
    seat.taken=true; c.seat=seat; c.state='seating'; c.sit=false; c.bubble.hidden=true; c.path=[[seat.ax,seat.az]];
    refreshMatch();
  }
  // Hitting a normal customer twice costs reputation; hitting a jerk (진상) pays.
  function applyHit(c,kind){
    c.hitCool=0.5; c.hits++;
    var px_=c.g.position.x, pz_=c.g.position.z;
    if(c.jerk){
      var amt=kind==='pan'?JERK_PAN:JERK_THROW;
      gain(amt); S.hits++;
      pop('진상 퇴치! +'+won(amt),'good',px_,2.9+c.y,pz_);
      sfx.ok();
      if(c.hits>=JERK_HITS){
        setTimeout(function(){pop('줄행랑!','good',px_,3.6,pz_);},150);
        leave(c,true);
      }
    }else if(c.hits>=2){
      pop('두 번이나 맞았어요!'+(S.sandbox?'':' 평판 하락'),'bad',px_,2.9+c.y,pz_);
      sfx.bad(); leave(c,false); loseRep(true);
    }else{
      pop('아야! 또 맞으면 화낼 거예요','bad',px_,2.9+c.y,pz_);
      sfx.no();
    }
    updHUD();
  }
  function itemHit(e,c){
    e.hitCool=0.5;
    if(c.state==='waiting'&&tryDeliver(c,e.item,true)){removeEnt(e);return;}
    knock(c,e.vx,e.vz,3.5,0,0.6);
    if(c.state!=='leaving') applyHit(c,'throw');
    e.vx*=-0.25; e.vz*=-0.25; e.vy=Math.abs(e.vy)*0.2+1.2;
    sfx.whack();
    for(var k=0;k<5;k++) puff(e.x,Math.max(0.3,e.y),e.z,'#fff3b0',0.5,(Math.random()-0.5)*3,Math.random()*2,(Math.random()-0.5)*3,0.4);
  }
  function checkOver(){
    if(S.rep<=0&&S.phase==='play'){
      S.rep=0; S.phase='end'; updHUD(); exitLook();
      setTimeout(function(){showOverlay('over');},900);
    }
  }

  /* ---------- stations: every action hands you a loose item ---------- */
  function binClick(type){giveItem({type:type});}
  function grillClick(i){
    var s=grill.slots[i];
    if(s.state==='empty'){
      var it=inv[sel];
      if(!it||it.type!=='rawpatty'){toast('생패티를 들고 누르세요. (생패티 상자에서 꺼내요)');sfx.no();return;}
      inv[sel]=null; refreshHeld();
      s.state='cooking'; s.t=0; s.dinged=false; s.puff=0; sfx.place(); return;
    }
    var out=s.t<COOK_RAW?{type:'rawpatty'}:{type:'patty',q:s.t>COOK_BURN?'burnt':'cooked'};
    if(giveItem(out)) s.state='empty';
  }
  function fryerClick(i){
    var s=fryer.slots[i];
    if(s.state==='empty'){
      var it=inv[sel];
      if(!it||it.type!=='potato'){toast('감자를 들고 누르세요. (감자 상자에서 꺼내요)');sfx.no();return;}
      inv[sel]=null; refreshHeld();
      s.state='cooking'; s.t=0; s.dinged=false; s.puff=0; sfx.place(); return;
    }
    var out=s.t<FRY_RAW?{type:'potato'}:{type:'fries',q:s.t>FRY_BURN?'burnt':'cooked',bites:3};
    if(giveItem(out)) s.state='empty';
  }
  function drinkClick(k){
    if(performance.now()<drinkCd) return;
    if(giveItem({type:'drink',flavor:k,sips:3})) drinkCd=performance.now()+500;
  }
  function ingOk(it){return !!it&&(it.type==='bun'||it.type==='cheese'||it.type==='lettuce'||it.type==='tomato'||it.type==='patty'||it.type==='rawpatty');}
  function trayClick(){
    var it=inv[sel];
    if(ingOk(it)){
      if(it.type==='rawpatty'){toast('생패티는 그릴에서 먼저 익혀야 해요.');sfx.no();return;}
      if(it.type==='patty'&&it.q!=='cooked'){toast('탄 패티는 쓸 수 없어요.');sfx.no();return;}
      if(!canAdd(it.type)) return;
      tray.stack.push(it.type); inv[sel]=null; rebuildTray(true); refreshHeld(); sfx.click(); return;
    }
    if(trayEmpty()){toast('조립대가 비어 있어요. 빵부터 들고 E를 누르세요.');sfx.no();return;}
    if(giveItem({type:'burger',stack:tray.stack.slice(),eaten:false})) clearTray();
  }
  function trashClick(){
    if(inv[sel]){inv[sel]=null;refreshHeld();sfx.place();toast('버렸어요.');return;}
    if(!trayEmpty()){clearTray();sfx.place();toast('조립대를 비웠어요.');return;}
    toast('버릴 게 없어요.');
  }
  function handOver(c){
    if(c.state!=='waiting'){toast('지금은 받을 수 없어요.');return;}
    var it=inv[sel];
    if(!it){toast('주문서를 보고 음식을 들어 건네 주세요.');sfx.no();return;}
    if(tryDeliver(c,it,false)){inv[sel]=null;refreshHeld();}
  }
  function interact(){
    var a=aimInfo();
    if(a.kind==='item'){if(giveItem(a.e.item)) removeEnt(a.e);return;}
    if(a.kind!=='station') return;
    var u=a.obj.userData;
    if(u.action==='bin') binClick(u.k);
    else if(u.action==='grill') grillClick(u.k);
    else if(u.action==='fryer') fryerClick(u.k);
    else if(u.action==='drink') drinkClick(u.k);
    else if(u.action==='tray') trayClick();
    else if(u.action==='trash') trashClick();
    else if(u.action==='cust'){if(u.cust)handOver(u.cust);}
  }

  /* ---------- using what you hold ---------- */
  function eat(){
    var it=inv[sel];
    if(!it||it.type==='pan'||it.type==='ext'){toast('먹을 수 있는 걸 들어 보세요.');sfx.no();return;}
    if(S.full>=96){toast('배불러서 더 못 먹어요!');sfx.no();return;}
    it.eaten=true; eatT=0.3;
    var gone=false;
    if(it.type==='burger'){it.stack.pop();sfx.bite();S.full+=7;gone=!it.stack.length;}
    else if(it.type==='fries'){it.bites=(it.bites||3)-1;sfx.bite();S.full+=5;gone=it.bites<=0;}
    else if(it.type==='drink'){it.sips=(it.sips||3)-1;sfx.sip();S.full+=4;S.boost=Math.max(S.boost,6);gone=it.sips<=0;}
    else{sfx.bite();S.full+=(it.type==='rawpatty'||it.type==='potato')?2:4;gone=true;if(it.type==='rawpatty')toast('으엑, 생고기예요!');}
    S.full=Math.min(100,S.full);
    if(gone) inv[sel]=null;
    refreshHeld(); updHUD();
  }
  function throwSel(hard){
    var it=inv[sel];
    if(!it){toast('손에 든 게 없어요.');return;}
    inv[sel]=null;
    var d=viewDir(), cp=camPos(), sp=hard?17:5;
    var e=spawnItem(it,cp.x+d.x*0.6,cp.y-0.2+d.y*0.6,cp.z+d.z*0.6,d.x*sp,d.y*sp+(hard?2.2:1.2),d.z*sp);
    e.hitCool=0.15;
    refreshHeld(); if(hard) sfx.throwS(); else sfx.place();
  }
  function swing(){if(swingT>0)return;swingT=0.001;swingHit=false;sfx.swing();}
  function panHit(){
    var f=fwdVec(), cp=camPos(), any=false;
    S.cust.slice().forEach(function(c){
      if(c.hitCool>0||(c.state==='leaving'&&c.path.length===0)) return;
      var dx=c.g.position.x-cp.x, dz=c.g.position.z-cp.z, d=Math.hypot(dx,dz);
      if(d<3.4&&(d<0.8||(dx*f.x+dz*f.z)/d>0.35)){
        any=true; knock(c,f.x,f.z,11,4.2,1.1); if(c.state!=='leaving') applyHit(c,'pan');
        for(var i=0;i<6;i++) puff(c.g.position.x,1.6,c.g.position.z,'#fff3b0',0.7,(Math.random()-0.5)*3,Math.random()*2,(Math.random()-0.5)*3,0.5);
      }
    });
    if(any) sfx.whack();
  }
  function spray(dt){
    var f=fwdVec(), cp=camPos(), rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw), d=viewDir();
    for(var i=0;i<3;i++){
      puff(cp.x+d.x*0.7+rx*0.3,cp.y-0.3+d.y*0.7,cp.z+d.z*0.7+rz*0.3,'#ffffff',1.3,d.x*10+(Math.random()-0.5)*2.4,d.y*10+(Math.random()-0.5)*2.4,d.z*10+(Math.random()-0.5)*2.4,0.55);
    }
    sprayT-=dt; if(sprayT<=0){sprayT=0.1;sfx.spray();}
    S.cust.forEach(function(c){
      var dx=c.g.position.x-cp.x, dz=c.g.position.z-cp.z, dist=Math.hypot(dx,dz);
      if(dist<9&&dist>0.2&&(dx*f.x+dz*f.z)/dist>0.9){
        c.kv.x+=f.x*34*dt; c.kv.z+=f.z*34*dt;
        var sp=Math.hypot(c.kv.x,c.kv.z); if(sp>8){c.kv.x*=8/sp;c.kv.z*=8/sp;}
        c.stun=Math.max(c.stun,0.3);
      }
    });
    // loose items get blown away too
    items.forEach(function(e){
      if(e.mount) return;
      var dx=e.x-cp.x, dz=e.z-cp.z, dist=Math.hypot(dx,dz);
      if(dist<6&&dist>0.2&&(dx*f.x+dz*f.z)/dist>0.88&&Math.abs(e.y-cp.y)<2.2){
        e.rest=false; e.vx+=f.x*18*dt; e.vz+=f.z*18*dt; if(e.vy<2) e.vy+=10*dt;
      }
    });
  }
  function useAction(){
    if(S.phase!=='play') return;
    var it=inv[sel];
    if(!it){toast('손이 비었어요. 1~6번 칸을 확인하세요.');return;}
    if(it.type==='pan') swing();
    else if(it.type!=='ext') throwSel(true);
  }

  function showOverlay(kind){

    if(kind==='start'||kind==='pause'){
      h+='<h1>wnstj 버거</h1><p class="sub">직접 걸어 다니며 주문을 받는 1인칭 버거 가게예요. 재료도 도구도 전부 집어서 쓰는 물건이에요.</p>'+keyList()+
      '<p class="sub">상자에서 재료를 꺼내 조립대에 쌓고(E), 그릴과 튀김기로 익힌 걸 손에 들어 손님에게 건네세요. 버거·감자튀김·음료는 하나씩 따로 건네도 돼요. 프라이팬과 소화기는 벽에서 집으면 사라지고, 던지면 떨어진 자리에 남아요. 같은 손님을 두 번 맞히면 평판이 떨어지지만, 빨간 “진상” 손님은 맞히면 돈을 내고 세 번 맞으면 도망가요. 소화기를 아래로 쏘면 몸이 떠올라요.</p>'+
      '<div class="row"><button class="btn" id="go" type="button">'+(kind==='pause'?'계속하기':'영업 시작')+'</button>'+
      (kind==='pause'?'<button class="btn" id="toMenu" type="button" style="background:var(--yellow);color:var(--ink)">처음 화면</button>':'<button class="btn" id="go2" type="button" style="background:var(--yellow);color:var(--ink)">샌드박스</button>')+'</div>';
    }else if(kind==='day'){
      var n=S.lastStars, msg=n===3?'완벽한 하루였어요.':(n===0?'목표에 못 미쳤어요. 내일은 더 잘할 수 있어요.':'목표를 달성했어요.');
      h+='<h1>'+S.day+'일차 마감</h1><p class="sub">'+msg+'</p>'+starsSVG(n)+
      '<dl class="sum"><div><dt>오늘 매출</dt><dd>'+won(S.dayMoney)+'</dd></div><div><dt>목표</dt><dd>'+won(S.cfg.goal)+'</dd></div>'+
      '<div><dt>서빙한 손님</dt><dd>'+S.served+'명</dd></div><div><dt>놓친 손님</dt><dd>'+S.missed+'명</dd></div>'+
      '<div><dt>진상 퇴치</dt><dd>'+S.hits+'회</dd></div><div><dt>누적 매출</dt><dd>'+won(S.bank)+'</dd></div></dl>'+
      '<div class="row"><button class="btn" id="go" type="button">'+(S.day+1)+'일차 시작</button></div>';
    }else{
      h+='<h1>영업 종료</h1><p class="sub">평판이 바닥나서 손님이 끊겼어요. 주문서를 먼저 확인해 보세요.</p>'+
      '<dl class="sum"><div><dt>도달한 날</dt><dd>'+S.day+'일차</dd></div><div><dt>누적 매출</dt><dd>'+won(S.bank)+'</dd></div>'+
      '<div><dt>오늘 서빙</dt><dd>'+S.served+'명</dd></div><div><dt>최고 연속</dt><dd>'+S.bestCombo+'회</dd></div></dl>'+
      '<div class="row"><button class="btn" id="go" type="button">처음부터 다시</button></div>';
    }
    p.innerHTML=h; o.hidden=false;
    var go=$('#go');
    go.addEventListener('click',function(){
      ensureAudio(); sfx.click(); requestLook();
      if(kind==='pause'){o.hidden=true;S.phase='play';}
      else if(kind==='day'){S.day++;startDay(false);}
      else if(kind==='over'){resetAll();startDay(false);}
      else startDay(false);
    });
    var g2=$('#go2');
    if(g2) g2.addEventListener('click',function(){ensureAudio();sfx.click();requestLook();S.day=1;S.bank=0;startDay(true);});
    var tm=$('#toMenu');
    if(tm) tm.addEventListener('click',function(){ensureAudio();sfx.click();S.phase='menu';resetAll();resetWorld();updHUD();showOverlay('start');});
    go.focus();
  }

  /* ---------- input ---------- */
  var keys={}, stick={x:0,y:0}, jumpReq=false;
  function clampPitch(){P.pitch=Math.max(-1.35,Math.min(1.35,P.pitch));}
  function pauseGame(){S.phase='paused';sprayOn=false;exitLook();showOverlay('pause');}
  window.addEventListener('keydown',function(e){
    keys[e.code]=true;
    if(S.phase!=='play') return;
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0) e.preventDefault();
    if(e.repeat) return;
    ensureAudio();
    if(e.code==='KeyE') interact();
    else if(e.code==='KeyF') eat();
    else if(e.code==='KeyG') throwSel(false);
    else if(e.code==='KeyQ') throwSel(true);
    else if(e.code==='Space') jumpReq=true;
    else if(e.code==='KeyV') toggleLook();
    else if(e.code==='KeyP') pauseGame();
    else if(/^Digit[1-6]$/.test(e.code)) selectSlot(+e.code.slice(5)-1);
    else if(S.sandbox&&e.code==='KeyZ'){if(!spawnCustomer(false)) toast('자리가 없어요.');}
    else if(S.sandbox&&e.code==='KeyX'){if(!spawnCustomer(true)) toast('자리가 없어요.');}
  });
  window.addEventListener('keyup',function(e){keys[e.code]=false;});
  window.addEventListener('blur',function(){keys={};sprayOn=false;});
  window.addEventListener('wheel',function(e){if(S.phase==='play'&&e.deltaY) selectSlot(sel+(e.deltaY>0?1:-1));},{passive:true});
  $('#hotbar').addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.slot'):null;
    if(b&&S.phase==='play'){ensureAudio();selectSlot(+b.getAttribute('data-i'));}
  });
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
  function startUse(){var it=inv[sel];if(it&&it.type==='ext') sprayOn=true; else useAction();}
  canvas.addEventListener('mousedown',function(e){
    ensureAudio();
    if(S.phase!=='play') return;
    if(e.button===0) startUse();
    else if(e.button===2&&locked) eat();
  });
  window.addEventListener('mouseup',function(e){if(e.button===0) sprayOn=false;});
  window.addEventListener('mousemove',function(e){
    if(S.phase!=='play') return;
    if(locked||(e.buttons&2)){
      P.yaw-=e.movementX*0.0022; P.pitch-=e.movementY*0.0022; clampPitch();
    }
  });
  // touch: drag the view, joystick, buttons
  var lookId=null, lastTX=0, lastTY=0, stickId=null;
  function showTouch(){isTouch=true;$('#touch').hidden=false;}
  if(isTouch) showTouch();
  window.addEventListener('touchstart',function(){if(!isTouch) showTouch();},{passive:true,once:true});
  canvas.addEventListener('pointerdown',function(e){
    if(e.pointerType!=='touch') return;
    ensureAudio(); lookId=e.pointerId; lastTX=e.clientX; lastTY=e.clientY;
    try{canvas.setPointerCapture(e.pointerId);}catch(er){}
  });
  canvas.addEventListener('pointermove',function(e){
    if(e.pointerType!=='touch'||e.pointerId!==lookId||S.phase!=='play') return;
    P.yaw-=(e.clientX-lastTX)*0.006; P.pitch-=(e.clientY-lastTY)*0.006; clampPitch();
    lastTX=e.clientX; lastTY=e.clientY;
  });
  function endLook(e){if(e.pointerId===lookId) lookId=null;}
  canvas.addEventListener('pointerup',endLook); canvas.addEventListener('pointercancel',endLook);
  var stickEl=$('#stick'), knobEl=$('#knob');
  function stickMove(e){
    var r=stickEl.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2), l=Math.hypot(dx,dy);
    if(l>1){dx/=l;dy/=l;}
    stick.x=dx; stick.y=dy;
    knobEl.style.transform='translate('+Math.round(dx*34)+'px,'+Math.round(dy*34)+'px)';
  }
  stickEl.addEventListener('pointerdown',function(e){ensureAudio();stickId=e.pointerId;try{stickEl.setPointerCapture(e.pointerId);}catch(er){}stickMove(e);});
  stickEl.addEventListener('pointermove',function(e){if(e.pointerId===stickId) stickMove(e);});
  function stickEnd(e){if(e.pointerId!==stickId) return; stickId=null; stick.x=0; stick.y=0; knobEl.style.transform='';}
  stickEl.addEventListener('pointerup',stickEnd); stickEl.addEventListener('pointercancel',stickEnd);
  function tbtn(id,down,up){
    var el=$(id);
    el.addEventListener('pointerdown',function(e){e.preventDefault();ensureAudio();if(S.phase==='play')down();});
    if(up){el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);}
  }
  tbtn('#tbAct',startUse,function(){sprayOn=false;});
  tbtn('#tbUse',interact); tbtn('#tbEat',eat); tbtn('#tbDrop',function(){throwSel(false);}); tbtn('#tbThrow',function(){throwSel(true);});
  tbtn('#tbJump',function(){jumpReq=true;});

  $('#helpBtn').addEventListener('click',function(){ensureAudio();if(S.phase==='play') pauseGame();});
  $('#sndBtn').addEventListener('click',function(){ensureAudio();muted=!muted;this.textContent=muted?'소리 꺼짐':'소리 켜짐';if(!muted)sfx.click();});

  /* ---------- aim prompt ---------- */
  var promptEl=$('#prompt'), crossEl=$('#cross'), lastHover=null, lastPrompt='';
  var EK=function(){return '<kbd>'+(isTouch?'줍기':'E')+'</kbd>';};
  function promptFor(a){
    if(a.kind==='item') return EK()+itemName(a.e.item)+' 줍기';
    if(a.kind!=='station') return null;
    var u=a.obj.userData, it=inv[sel];
    switch(u.action){
      case 'bin': return EK()+itemName({type:u.k})+' 꺼내기';
      case 'grill':{var s=grill.slots[u.k];if(s.state==='empty')return (it&&it.type==='rawpatty')?EK()+'패티 올리기':'생패티를 들고 '+EK();if(s.t<COOK_RAW)return EK()+'덜 익은 패티 꺼내기';if(s.t>COOK_BURN)return EK()+'탄 패티 꺼내기';return EK()+'패티 집기';}
      case 'fryer':{var f=fryer.slots[u.k];if(f.state==='empty')return (it&&it.type==='potato')?EK()+'감자 튀기기':'감자를 들고 '+EK();if(f.t<FRY_RAW)return EK()+'덜 익은 감자 꺼내기';if(f.t>FRY_BURN)return EK()+'탄 감자 꺼내기';return EK()+'감자튀김 건지기';}
      case 'drink': return EK()+DRINKS[u.k].name+' 받기';
      case 'tray': return ingOk(it)?EK()+'재료 올리기':(trayEmpty()?'재료를 들고 '+EK():EK()+'버거 집기');
      case 'trash': return EK()+(it?'버리기':'조립대 비우기');
      case 'cust':{var c=u.cust;return c&&c.state==='waiting'?EK()+(it?'건네기: '+itemName(it):'주문 확인'):null;}
    }
    return null;
  }
  function updAim(){
    var a=S.phase==='play'?aimInfo():{kind:null}, h=a.kind==='station'?a.obj:null;
    if(lastHover!==h){
      if(lastHover&&lastHover.userData.edges) lastHover.userData.edges.visible=false;
      if(h&&h.userData.edges) h.userData.edges.visible=true;
      lastHover=h;
    }
    var txt=promptFor(a);
    crossEl.classList.toggle('on',!!txt);
    var key=txt||'';
    if(key!==lastPrompt){lastPrompt=key;promptEl.innerHTML=key;promptEl.classList.toggle('on',!!key);}
  }

  // height of the highest box under the player that can be stepped or jumped onto
  function insideBuilding(x,z){return x>-12.4&&x<12.4&&z>-0.4&&z<16.4;}
  function groundAt(x,z,y){
    var g=0;
    if(y>=4.05&&insideBuilding(x,z)) g=4.5; // the roof
    for(var i=0;i<cols.length;i++){
      var c=cols[i];
      if(x>c.x0-0.3&&x<c.x1+0.3&&z>c.z0-0.3&&z<c.z1+0.3&&c.h<=y+0.45&&c.h>g) g=c.h;
    }
    return g;
  }

  /* ---------- main loop ---------- */
  var last=performance.now(), hudT=0;
  function frame(now){
    requestAnimationFrame(frame);
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    var play=S.phase==='play', hi=inv[sel];
    if(play){
      if(!S.sandbox){S.left-=dt;} updClock();
      stepStation(grill,COOK_RAW,COOK_BURN,C_PAT,dt);
      stepStation(fryer,FRY_RAW,FRY_BURN,C_FRY,dt);
      S.spawnT-=dt;
      if(S.spawnT<=0&&(S.sandbox||S.left>10)){
        if(S.sandbox&&S.cust.length>=3) S.spawnT=2;
        else if(spawnCustomer()) S.spawnT=S.cfg.spawnMin+Math.random()*(S.cfg.spawnMax-S.cfg.spawnMin);
        else S.spawnT=1;
      }
      S.full=Math.max(0,S.full-1.2*dt); S.boost=Math.max(0,S.boost-dt);
      hudT-=dt; if(hudT<=0){hudT=0.25;updHUD();}
      // movement
      var ax=0,az=0;
      if(keys.KeyW) az+=1; if(keys.KeyS) az-=1; if(keys.KeyD) ax+=1; if(keys.KeyA) ax-=1;
      az+=-stick.y; ax+=stick.x;
      var al=Math.hypot(ax,az); if(al>1){ax/=al;az/=al;}
      if(keys.ArrowLeft) P.yaw+=1.9*dt; if(keys.ArrowRight) P.yaw-=1.9*dt;
      if(keys.ArrowUp) P.pitch+=1.5*dt; if(keys.ArrowDown) P.pitch-=1.5*dt; clampPitch();
      var sp=((keys.ShiftLeft||keys.ShiftRight)?7.0:4.6)*(S.boost>0?1.35:1);
      var fx_=-Math.sin(P.yaw), fz_=-Math.cos(P.yaw), rx_=Math.cos(P.yaw), rz_=-Math.sin(P.yaw);
      var tvx=(fx_*az+rx_*ax)*sp, tvz=(fz_*az+rz_*ax)*sp, k=Math.min(1,dt*10);
      P.vx+=(tvx-P.vx)*k; P.vz+=(tvz-P.vz)*k;
      var dec=Math.exp(-(P.onG?4:0.5)*dt); P.ex*=dec; P.ez*=dec;
      P.x+=(P.vx+P.ex)*dt; P.z+=(P.vz+P.ez)*dt;
      var gnd=groundAt(P.x,P.z,P.y);
      if(jumpReq&&P.y<=gnd+0.001){P.vy=5.4;}
      jumpReq=false;
      // fire extinguisher recoil: the blast pushes you opposite to where you aim, much harder near a surface
      if(sprayOn&&hi&&hi.type==='ext'){
        var vd=viewDir(), cq=camPos(), near=false;
        for(var sdist=0.6;sdist<=4.6&&!near;sdist+=0.5){
          var qx=cq.x+vd.x*sdist, qy=cq.y+vd.y*sdist, qz=cq.z+vd.z*sdist;
          if(qy<=0.05||insideCol(qx,qy,qz)||(qy>=4.2&&insideBuilding(qx,qz))) near=true;
        }
        var A=near?26:7;
        P.ex-=vd.x*A*dt; P.ez-=vd.z*A*dt; P.vy-=vd.y*A*dt;
        var es=Math.hypot(P.ex,P.ez); if(es>16){P.ex*=16/es;P.ez*=16/es;}
      }
      P.vy-=15*dt; if(P.vy>30)P.vy=30; if(P.vy<-40)P.vy=-40;
      P.y+=P.vy*dt;
      var gnd2=groundAt(P.x,P.z,P.y);
      if(P.y<=gnd2){P.y=gnd2;if(P.vy<0)P.vy=0;}
      if(insideBuilding(P.x,P.z)&&P.y<4.05&&P.y>2.3){P.y=2.3;if(P.vy>0)P.vy=0;} // head hits the ceiling indoors
      P.onG=P.y<=gnd2+0.001;
      resolve(P,0.4,P.y);
      P.x=Math.max(-58,Math.min(58,P.x)); P.z=Math.max(0.5,Math.min(62,P.z));
      var mv=Math.hypot(P.vx,P.vz);
      if(mv>0.3&&P.onG) P.bob+=dt*mv*1.9;
      // tools
      if(swingT>0){
        swingT+=dt/0.5;
        if(!swingHit&&swingT>0.4){swingHit=true;panHit();}
        if(swingT>=1) swingT=0;
      }
      if(sprayOn&&hi&&hi.type==='ext') spray(dt); else sprayT=0;
      if(eatT>0) eatT=Math.max(0,eatT-dt);
    }
    if(S.phase!=='paused'){
      S.cust.slice().forEach(function(c){updCustomer(c,dt,play);});
      updItems(dt); updPuffs(dt);
      for(var i=fx.length-1;i>=0;i--) if(fx[i](dt)) fx.splice(i,1);
    }
    if(play&&!S.sandbox&&S.left<=0) endDay();
    // camera + view model
    var bobY=reduceMotion?0:Math.sin(P.bob)*0.035;
    camera.position.set(P.x,1.7+P.y+bobY,P.z);
    camera.rotation.set(P.pitch,P.yaw,0);
    vm.position.set(0,reduceMotion?0:Math.sin(P.bob)*0.008,0);
    if(hi&&vmItem.visible){
      if(hi.type==='pan'){
        var t=swingT, ry=0.2;
        if(t>0){ry=t<0.25?0.2+(t/0.25)*0.5:(t<0.6?0.7-((t-0.25)/0.35)*1.9:-1.2+((t-0.6)/0.4)*1.4);}
        vmItem.rotation.set(t>0?-0.25:0,ry,t>0?0.15:0);
      }else if(hi.type==='ext'){
        var sh=(sprayOn&&S.phase==='play')?Math.sin(now/30)*0.015:0;
        vmItem.position.set(0.3+sh,-0.28+sh,-0.5);
      }else{
        var ek=eatT>0?Math.sin(Math.PI*(1-eatT/0.3)):0;
        vmItem.position.set(0.28-0.28*ek,-0.34+0.2*ek,-0.62+0.2*ek);
      }
    }
    // world animation
    clouds.forEach(function(c){c.position.x+=dt*1.2;if(c.position.x>230)c.position.x=-230;});
    S.cust.forEach(function(c){if(c.state==='waiting') placeBubble(c); if(c.sayEl) placeSay(c);});
    updAim();
    renderer.render(scene,camera);
  }

  spawnTools(); updHUD(); updClock(); rebuildTray(); refreshHeld(); setLockTxt();
  showOverlay('start');
  requestAnimationFrame(frame);
}
})();
</script>

</body></html>
