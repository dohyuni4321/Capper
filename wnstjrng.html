<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--bg:#0b0a10;--panel:#15131f;--line:#2a2638;--txt:#f3efe6;--dim:#8d879c;--c:#ffc72c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1d1730,#0b0a10 60%);color:var(--txt);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;min-height:100vh}
header{text-align:center;padding:22px 12px 6px}
h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:2px;color:#ffc72c;text-shadow:0 0 18px #ffc72c88,0 0 40px #d2232a66}
h1 span{color:#d2232a}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px}
.chip b{color:var(--c)}
#dtWall{display:none;position:fixed;inset:0;z-index:999;background:#000;color:#fff;align-items:center;justify-content:center;font-size:22px;font-weight:800}
#dtWall.on{display:flex}
#con{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#0a0912f2;border-top:2px solid var(--c);padding:8px;font:13px/1.5 ui-monospace,Consolas,monospace}
#conOut{max-height:30vh;overflow:auto;color:#9fe29f;margin-bottom:6px;white-space:pre-wrap}
#conIn{width:100%;background:#15131f;border:1px solid var(--line);color:#fff;padding:8px;border-radius:8px;font:inherit}
.potbox{max-width:520px;margin:0 auto 12px;background:var(--panel);border:1px solid #4caf50;border-radius:12px;padding:8px 14px;text-align:center;font-size:13px;box-shadow:0 0 18px #4caf5033}
.potbox.low{border-color:#ff5252;box-shadow:0 0 18px #ff525255}
.potbar{height:6px;background:#2a2638;border-radius:99px;margin-top:6px;overflow:hidden}
.potbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6fdc6f,#ffc72c);border-radius:99px;transition:width .25s linear}
.potbox.low .potbar i{background:#ff5252}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 14px;text-align:center;position:relative;overflow:hidden;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,var(--glow,#0000) 0%,#0000 65%);opacity:.55;transition:.4s}
#view{width:100%;height:360px;position:relative;z-index:1;cursor:grab;touch-action:none;margin:-10px 0 4px}
#view:active{cursor:grabbing}
#view canvas{display:block;width:100%!important;height:100%!important}
.hintline{position:relative;z-index:1;color:var(--dim);font-size:11px;margin-bottom:6px}
.aura-tier{font-size:13px;letter-spacing:3px;font-weight:700;position:relative}
.aura-name{font-size:clamp(24px,5.5vw,44px);font-weight:900;margin:8px 0;position:relative;text-shadow:0 0 22px var(--glow,#fff)}
.aura-odds{font-size:15px;color:var(--dim);position:relative}
.aura-flavor{font-size:13px;color:var(--dim);margin-top:6px;position:relative;font-style:italic}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
button{font:inherit;cursor:pointer;border:0}
.roll{display:block;margin:16px auto 6px;background:linear-gradient(#ffd54a,#ffb300);color:#3a1d00;font-weight:900;font-size:22px;padding:14px 56px;border-radius:14px;box-shadow:0 5px 0 #a86f00,0 0 24px #ffc72c55;transition:.08s}
.roll:active{transform:translateY(4px);box-shadow:0 1px 0 #a86f00}
.roll:disabled{filter:grayscale(.7);opacity:.7}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:#2b5b2a;border-color:#4caf50}
.tabs{display:flex;gap:6px;margin:22px 0 10px;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 16px;border-radius:10px}
.tab.act{color:#3a1d00;background:#ffc72c;font-weight:800}
.hide{display:none}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.item h3{margin:0 0 4px;font-size:15px}
.item p{margin:0 0 10px;color:var(--dim);font-size:12px;min-height:32px}
.item button{background:#ffc72c;color:#3a1d00;font-weight:800;padding:7px 12px;border-radius:8px;width:100%}
.item button:disabled{background:#3a3548;color:#777}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.f{background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:99px;font-size:12px;color:var(--dim)}
.f.act{border-color:var(--c);color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc,#555);border-radius:10px;padding:8px 10px;font-size:13px}
.card .n{font-weight:700}
.card .o{color:var(--dim);font-size:11px;margin-top:2px}
.card.eq{box-shadow:0 0 0 2px var(--c) inset;background:#1d1a2b}
.card:not(.lock):hover{background:#1d1a2b}
.card.lock{opacity:.45}
.card.lock .n{color:var(--dim)}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{padding:4px 0;border-bottom:1px solid #1f1c2c}
#cut{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#000;overflow:hidden}
#cut.show{display:flex;animation:cin .3s}
@keyframes cin{from{opacity:0}to{opacity:1}}
#cut .flash{position:absolute;inset:0;background:var(--glow);animation:fl 1.4s ease-out forwards}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#cut .rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(from 0deg,var(--glow) 0 5deg,transparent 5deg 16deg);opacity:.28;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 45%);mask-image:radial-gradient(circle,#000 0,transparent 45%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#cut .ct{position:relative;font-size:16px;letter-spacing:6px;font-weight:800}
#cut .cn{position:relative;font-size:clamp(34px,9vw,92px);font-weight:900;margin:12px 0;text-shadow:0 0 30px var(--glow),0 0 70px var(--glow);animation:zoom 1.2s cubic-bezier(.2,1.5,.4,1)}
@keyframes zoom{from{transform:scale(.1) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}
#cut .co{position:relative;font-size:18px;color:#ddd}
#cut .hint{position:absolute;bottom:20px;color:#888;font-size:12px}
.shake{animation:shake .5s 3}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-8px,5px)}50%{transform:translate(7px,-6px)}75%{transform:translate(-5px,-4px)}}
.drop{position:absolute;top:-60px;font-size:34px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.rainbow{animation:rb 1.2s linear infinite}
@keyframes rb{to{filter:hue-rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--c);padding:8px 16px;border-radius:10px;z-index:60;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>WNSTJ <span>RNG</span> 🍔</h1>
  <div class="sub">뚱뚱하고 빅맥을 사랑하는 wnstj의 아우라를 굴려보자 · 총 <span id="total"></span>종</div>
</header>
<div class="wrap">
  <div class="bar">
    <div class="chip">🎲 롤 <b id="sRolls">0</b></div>
    <div class="chip">🪙 코인 <b id="sCoins">0</b></div>
    <div class="chip">🍀 Luck <b id="sLuck">x1</b> <span id="sPotion"></span></div>
    <div class="chip">📖 도감 <b id="sDex">0</b></div>
    <div class="chip">🏆 최고 <b id="sBest">-</b></div>
  </div>

  <div class="potbox hide" id="potBox"><div id="potTxt"></div><div class="potbar"><i id="potFill"></i></div></div>

  <div class="stage" id="stage">
    <div id="view"></div>
    <div class="hintline" id="hintline">롤을 돌려 아우라를 뽑아보세요 · 드래그로 돌려보기</div>
    <div class="aura-tier" id="aTier">READY</div>
    <div class="aura-name" id="aName">🍔 굴려보세요</div>
    <div class="aura-odds" id="aOdds">버튼을 눌러 wnstj의 운명을 확인</div>
    <div class="aura-flavor" id="aFlavor"></div>
  </div>
  <button class="roll" id="rollBtn">ROLL 🍟</button>
  <div class="row">
    <button class="btn" id="equipBtn" disabled>⭐ 가장 좋은 아우라 장착</button>
    <button class="btn" id="autoBtn">자동 롤: OFF</button>
    <button class="btn" id="skipBtn">연출 스킵: OFF</button>
    <button class="btn" id="resetBtn">데이터 초기화</button>
  </div>

  <div class="tabs">
    <button class="tab act" data-t="shop">🛒 상점</button>
    <button class="tab" data-t="dex">📖 도감</button>
    <button class="tab" data-t="log">📜 기록</button>
  </div>

  <div id="shop" class="shop"></div>
  <div id="dex" class="hide">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="log" class="hide"><div class="log" id="logBox"></div></div>
</div>

<div id="con" class="hide"><div id="conOut"></div><input id="conIn" placeholder="명령어 입력 (help)" autocomplete="off" spellcheck="false"></div>

<div id="cut">
  <div class="flash"></div>
  <div class="rays"></div>
  <div class="ct" id="cT"></div>
  <div class="cn" id="cN"></div>
  <div class="co" id="cO"></div>
  <div class="hint">클릭하면 닫혀요</div>
</div>

function beep(odds){
  try{

    const notes=odds>=1e9?[523,659,784,1047,1319,1568]:odds>=1e7?[523,659,784,1047]:[659,784,988];

      const o=ac.createOscillator(),g=ac.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,ac.currentTime+i*.12);
      g.gain.exponentialRampToValueAtTime(.15,ac.currentTime+i*.12+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.12+.35);
      o.connect(g);g.connect(ac.destination);
      o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.4);
    });
  }catch(e){}
}

    const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(pos,3));geo.setAttribute("color",new THREE.BufferAttribute(col,3));
    const gp=new THREE.Points(geo,new THREE.PointsMaterial({size:.1,map:TEX.dot,vertexColors:true,transparent:true,blending:AB,depthWrite:false}));
    gp.frustumCulled=false;V.aura.add(gp);AU.spins.push({o:gp,ax:[0,Rr(.15,.5)*dir(),0]});
    const SN=260,sp=new Float32Array(SN*3);
    for(let i=0;i<SN;i++){const u=rnd()*TAU,v=Math.acos(2*rnd()-1),R=8+rnd()*3;sp[i*3]=R*Math.sin(v)*Math.cos(u);sp[i*3+1]=Math.abs(R*Math.cos(v))*.8+.5;sp[i*3+2]=R*Math.sin(v)*Math.sin(u)}
    const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(sp,3));
    const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.14,map:TEX.dot,color:0xffffff,transparent:true,blending:AB,depthWrite:false}));
    stars.frustumCulled=false;V.aura.add(stars);AU.spins.push({o:stars,ax:[0,.03,0]});
  }
  // ----- 날개 (깃털 / 박쥐 / 불꽃) -----
  const wingTex=[TEX.wing,TEX.wing2,TEX.wing3];
  const addWings=(scale,y,color,list,phase,amp,tex)=>{
    for(const s of [-1,1]){
      const piv=new THREE.Group();piv.position.set(s*.4,y,-.75);
      const m=list(new THREE.MeshBasicMaterial({map:tex,color,transparent:true,opacity:.85,blending:AB,depthWrite:false,side:THREE.DoubleSide}));
      const w=new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.6),m);w.position.x=1.75;
      const holder=new THREE.Group();holder.scale.set(s*scale,scale,scale);holder.add(w);piv.add(holder);
      V.aura.add(piv);AU.wings.push({piv,s,ph:phase,amp});
    }
  };
  if(ti>=7){
    const v1=Math.floor(rnd()*3);
    addWings(Rr(.9,1.25),Rr(1.8,2.3),c1,tinted,0,1,wingTex[v1]);
    if(ti>=8)addWings(Rr(1.4,1.9),Rr(1.3,1.7),c2,tinted2,1.2,.8,wingTex[(v1+1+Math.floor(rnd()*2))%3]);
  }
  // ----- 황금 아치 (경외) -----
  if(ti>=8){
    const gold=rnd()<.5,ac=gold?new THREE.Color(0xffc72c):c2.clone();
    const am=new THREE.MeshBasicMaterial({color:ac});
    if(!gold)AU.tint2.push(am);
    AU.arches=new THREE.Group();AU.arches.position.set(0,0,-3.3);
    const na=rnd()<.5?2:3,sc=Rr(1.8,2.6);
    for(let k=0;k<na;k++){
      const arc=new THREE.Mesh(new THREE.TorusGeometry(1,.2,16,40,Math.PI),am);
      arc.scale.setScalar(sc);arc.position.x=(k-(na-1)/2)*sc*1.9;AU.arches.add(arc);
    }
    V.aura.add(AU.arches);
    const gm=new THREE.SpriteMaterial({map:TEX.glow,color:ac,transparent:true,opacity:.35,blending:AB,depthWrite:false});
    if(!gold)AU.tint2.push(gm);
    const gs=new THREE.Sprite(gm);gs.scale.setScalar(11);gs.position.set(0,1.6,-3.5);V.aura.add(gs);AU.glows.push({s:gs,base:.35,ph:.7});
  }
  // ----- 별빛 비 (경외) -----
  if(ti>=8){
    const rn=Math.floor(Rr(45,85));
    for(let i=0;i<rn;i++){
      const k=i%3,list=k===1?tinted2:tinted;
      const m=new THREE.SpriteMaterial({map:TEX.star,color:k===2?0xffffff:(k===1?c2:c1),transparent:true,blending:AB,depthWrite:false});
      if(k!==2)list(m);
      const s=new THREE.Sprite(m);s.scale.setScalar(.3+rnd()*.55);V.aura.add(s);
      AU.rain.push({s,x:(rnd()-.5)*8,z:(rnd()-.5)*5,y:rnd()*8,v:1.4+rnd()*1.8});
    }
  }
}
function updateAura(dt,t){
  if(!AU)return;
  const {ti,c1,c2}=AU;
  if(AU.rainbow){
    c1.setHSL((t*AU.rbSpd)%1,.9,.6);c2.setHSL((t*AU.rbSpd+AU.rbOff)%1,.9,.6);
    AU.tint.forEach(m=>m.color.copy(c1));AU.tint2.forEach(m=>m.color.copy(c2));
    if(AU.light)AU.light.color.copy(c1);
  }
  AU.flash=Math.max(0,AU.flash-dt*1.6);
  AU.glows.forEach(g=>{g.s.material.opacity=Math.min(1,g.base*(1+.25*Math.sin(t*AU.pulse+g.ph))+AU.flash*.45)});
  if(AU.light)AU.light.intensity=(.5+ti*.5)*(1+.2*Math.sin(t*3)+AU.flash);
  for(const P of AU.Ps){
    const pos=P.pos,col=P.col,m=P.mode,d=P.dir;
    for(let i=0;i<P.n;i++){
      const p=(P.ph[i]=(P.ph[i]+P.sp[i]*dt)%1);
      let x,y,z,r,an;
      if(m===0){P.ang[i]+=dt*1.1*d;r=P.rad[i]*(1-p*.25);y=p*4.4;x=Math.cos(P.ang[i])*r;z=Math.sin(P.ang[i])*r}
      else if(m===1){P.ang[i]+=dt*.8*d;const th=p*TAU;y=1.5+Math.cos(th)*P.rad[i]*1.15;r=Math.sin(th)*P.rad[i];x=Math.cos(P.ang[i])*r;z=Math.sin(P.ang[i])*r}
      else if(m===2){y=2.7+p*(1-p)*9-p*2.4;r=p*P.rad[i]*1.5;x=Math.cos(P.ang[i])*r;z=Math.sin(P.ang[i])*r}
      else if(m===3){P.ang[i]+=dt*2.6*d;r=P.rad[i]*(1-p)+.25;y=p*4.6;x=Math.cos(P.ang[i])*r;z=Math.sin(P.ang[i])*r}
      else if(m===4){an=p*10*d+(i%3)*TAU/3+t*1.2;r=.9+P.mix[i]*.35;y=p*4.6;x=Math.cos(an)*r;z=Math.sin(an)*r}
      else if(m===5){P.ang[i]+=dt*.3*d;r=.5+p*P.rad[i]*2.3;y=.1+Math.sin(p*Math.PI)*.4;x=Math.cos(P.ang[i])*r;z=Math.sin(P.ang[i])*r}
      else if(m===6){P.ang[i]+=dt*.4*d;r=P.rad[i]*1.3+Math.sin(t*2+i)*.15;y=5.2-p*5.2;x=Math.cos(P.ang[i])*r;z=Math.sin(P.ang[i])*r}
      else{P.ang[i]+=dt*(.8+P.sp[i]*3)*d;r=P.rad[i]*1.1;const w=Math.sin(P.ang[i])*r;x=Math.cos(P.ang[i])*r;y=1.5+w*Math.sin(P.tilt);z=w*Math.cos(P.tilt)}
      pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;
      const f=Math.sin(p*Math.PI),mx=P.mix[i];
      col[i*3]=(c1.r+(c2.r-c1.r)*mx)*f;col[i*3+1]=(c1.g+(c2.g-c1.g)*mx)*f;col[i*3+2]=(c1.b+(c2.b-c1.b)*mx)*f;
    }
    P.geo.attributes.position.needsUpdate=true;P.geo.attributes.color.needsUpdate=true;
  }
  AU.emo.forEach(e=>{
    e.ang+=dt*e.sp;
    const zz=Math.sin(e.ang)*e.rad;
    e.o.position.set(Math.cos(e.ang)*e.rad,e.h+zz*Math.sin(e.tilt)*.6+Math.sin(t*2+e.bob)*.2,zz*Math.cos(e.tilt));
    e.o.rotation.y+=dt*e.spin;e.o.rotation.x+=dt*e.spin*.6;
  });
  AU.sparks.forEach(p=>{
    const v=Math.max(0,Math.sin(t*p.sp+p.ph));const k=v*v*v;
    p.s.material.opacity=k;p.s.scale.setScalar(p.base*(.25+.75*k));p.s.material.rotation+=dt*p.rot;
  });
  AU.flares.forEach(f=>{f.s.material.rotation+=dt*f.sp;f.s.material.opacity=.55+.25*Math.sin(t*2.2)+AU.flash*.3});
  AU.rain.forEach(r=>{
    r.y-=r.v*dt;
    if(r.y<-.2){r.y=7+Math.random()*2;r.x=(Math.random()-.5)*8;r.z=(Math.random()-.5)*5}
    r.s.position.set(r.x,r.y,r.z);r.s.material.rotation+=dt*1.5;
  });
  AU.rings.forEach(r=>{r.ph=(r.ph+dt*r.sp)%1;const s=1+r.ph*r.grow;r.m.scale.set(s,s,1);r.m.material.opacity=.55*(1-r.ph)});
  if(AU.pillar)AU.pillar.material.opacity=AU.pillarBase*(1+.3*Math.sin(t*3)+AU.flash);
  AU.beamMats.forEach((m,i)=>{m.opacity=(.14+ti*.02)*(1+.4*Math.sin(t*2+i))+AU.flash*.2});
  if(AU.halo){AU.halo.rotation.y+=dt*AU.haloSpd;AU.halo.position.y=3.5+Math.sin(t*2)*.06}
  AU.gyros.forEach(g=>{g.m.rotation.x+=dt*g.ax[0];g.m.rotation.y+=dt*g.ax[1];g.m.rotation.z+=dt*g.ax[2]});
  AU.spins.forEach(s=>{
    s.o.rotation.x+=dt*s.ax[0];s.o.rotation.y+=dt*s.ax[1];s.o.rotation.z+=dt*s.ax[2];
    if(s.shell){const k=1+.06*Math.sin(t*3);s.o.scale.setScalar(k)}
  });
  AU.wings.forEach(w=>{
    w.piv.rotation.y=-w.s*(.55+Math.sin(t*AU.flapSpd+w.ph)*.22*w.amp);
    w.piv.rotation.z=Math.sin(t*AU.flapSpd+w.ph)*.08;
  });
  AU.bolts.forEach(b=>{
    b.t-=dt;
    if(b.t<=0){regenBolt(b);b.t=.04+Math.random()*.16;b.l.visible=Math.random()>.25}
  });
  if(AU.arches){const k=1+.03*Math.sin(t*2);AU.arches.scale.setScalar(k)}
  if(ti>=7){
    AU.burstT-=dt;
    if(AU.burstT<=0){
      AU.burstT=ti>=8?2.6:4;
      const m=new THREE.MeshBasicMaterial({color:c1.clone(),transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
      const r=new THREE.Mesh(new THREE.RingGeometry(.96,1,72),m);r.rotation.x=-Math.PI/2;r.position.y=.07;V.aura.add(r);
      AU.bursts.push({m:r,age:0});
      V.shake=ti>=8?.28:.14;AU.flash=1;
    }
    for(let i=AU.bursts.length-1;i>=0;i--){
      const b=AU.bursts[i];b.age+=dt;
      const s=1+b.age*8;b.m.scale.set(s,s,1);b.m.material.opacity=Math.max(0,.9*(1-b.age/1.4));
      if(b.age>1.4){V.aura.remove(b.m);b.m.geometry.dispose();b.m.material.dispose();AU.bursts.splice(i,1)}
    }
  }
}

let viewId=null;
function bestAura(){
  let best=null;
  for(const id in S.found){const a=AURAS[id];if(a&&(!best||a.odds>best.odds))best=a}
  return best;
}
function viewAura(a){
  if(!V.aura||!a)return;
  buildAura(a);viewId=a.id;updateHint();
}
function equippedAura(){
  const a=AURAS[S.equip];
  return(a&&S.found[a.id])?a:bestAura();
}
function updateHint(){
  const best=bestAura(),eq=equippedAura(),a=AURAS[viewId];
  if(!a||!best||!eq){$("equipBtn").disabled=true;return}
  $("equipBtn").disabled=(eq.id===best.id&&viewId===best.id);
  $("hintline").textContent=viewId===eq.id
    ?`👑 장착 중: ${a.name} (1 in ${fmt(a.odds)}) · 도감에서 클릭하면 다른 아우라로 교체`
    :`👀 미리보기: ${a.name} · 장착 중: ${eq.name}`;
}
function equipAuraId(id){
  const a=AURAS[id];
  if(!a||!S.found[id])return;
  S.equip=id;save();viewAura(a);renderDex();
}
function equipBest(){
  const best=bestAura();
  if(!best)return;
  equipAuraId(best.id);
}


if(initView()){const q=equippedAura();if(q)viewAura(q)}
// ===== 인게임 콘솔 (` 키 또는 제목 5번 클릭) =====
const con=$("con"),conIn=$("conIn"),conOut=$("conOut");
const say=m=>{const d=document.createElement("div");d.textContent=m;conOut.appendChild(d);conOut.scrollTop=conOut.scrollHeight};
function findAura(q){q=q.trim();if(/^\d+$/.test(q))return AURAS[+q];const l=q.toLowerCase();return AURAS.find(a=>a.name.toLowerCase().includes(l))}
function refreshAll(){let bo=0,bn="";for(const id in S.found){const a=AURAS[id];if(a.odds>bo){bo=a.odds;bn=a.name}}S.best=bo;S.bestName=bn;save();renderAll();updateHint()}
const CMDS={
  help(){say("all — 모든 아우라 획득\ngive <번호|이름> — 아우라 하나 획득\nequip <번호|이름> — 획득 + 장착\nfind <이름> — 번호 검색\ncoins <수> — 코인 추가\nluck <배율> [초] — Luck (배율: "+POT_MULTS.join(", ")+")\nclear — 화면 정리")},
  all(){AURAS.forEach(a=>{S.found[a.id]=S.found[a.id]||1});refreshAll();say(`✅ 아우라 ${AURAS.length}종 전부 획득!`)},
  give(q){const a=findAura(q);if(!a)return say("❌ 못 찾았어요");S.found[a.id]=(S.found[a.id]||0)+1;refreshAll();say(`✅ ${a.name} (#${a.id}) 획득`)},
  equip(q){const a=findAura(q);if(!a)return say("❌ 못 찾았어요");S.found[a.id]=S.found[a.id]||1;refreshAll();equipAuraId(a.id);say(`✅ ${a.name} 장착`)},
  find(q){const l=q.trim().toLowerCase();const r=AURAS.filter(a=>a.name.toLowerCase().includes(l)).slice(0,15);say(r.length?r.map(a=>`#${a.id} ${a.name} (1 in ${fmt(a.odds)})`).join("\n"):"❌ 결과 없음")},
  coins(q){const n=Math.floor(+q);if(!Number.isFinite(n))return say("❌ 숫자를 입력하세요");S.coins=Math.min(1e15,Math.max(0,S.coins+n));save();renderAll();say(`✅ 코인 ${fmt(S.coins)}`)},
  luck(q){const [m,s]=q.trim().split(/\s+/).map(Number);if(!POT_MULTS.includes(m))return say("❌ 배율은 "+POT_MULTS.join(", ")+" 중에서");const sec=Math.min(600,Math.max(1,s||60));pot(m,sec);save();renderAll();renderPot();say(`✅ Luck x${fmt(m)} · ${sec}초`)},
  clear(){conOut.innerHTML=""}
};
function runCmd(line){
  const t=line.trim();if(!t)return;
  say("> "+t);
  const i=t.search(/\s/),c=(i<0?t:t.slice(0,i)).replace(/^\//,"").toLowerCase(),arg=i<0?"":t.slice(i+1);
  if(CMDS[c])CMDS[c](arg);else say("❌ 모르는 명령어 (help)");
}
let conInit=false;
function toggleCon(){
  con.classList.toggle("hide");
  if(!con.classList.contains("hide")){if(!conInit){conInit=true;say("🔧 콘솔 — help 를 입력하세요")}conIn.focus()}else conIn.blur();
}
conIn.addEventListener("keydown",e=>{if(e.key==="Enter"){runCmd(conIn.value);conIn.value=""}});
document.addEventListener("keydown",e=>{if(e.key==="`"||e.code==="Backquote"){e.preventDefault();toggleCon()}});
let tc=0,tt=0;
document.querySelector("h1").addEventListener("click",()=>{const n=Date.now();tc=(n-tt>2000)?1:tc+1;tt=n;if(tc>=5){tc=0;toggleCon()}});
// ===== 개발자 도구 차단 =====
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  const k=(e.key||"").toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(e.key==="F12"||(c&&e.shiftKey&&["i","j","c","k"].includes(k))||(c&&k==="u")||(e.metaKey&&e.altKey&&["i","j","u","c"].includes(k))){e.preventDefault();e.stopPropagation();return false}
},true);
if(window.self===window.top){
  const wall=document.createElement("div");wall.id="dtWall";wall.textContent="🚫 개발자 도구를 닫아주세요";document.body.appendChild(wall);
  const chk=()=>{dtOpen=(window.outerWidth-window.innerWidth>200)||(window.outerHeight-window.innerHeight>260);wall.classList.toggle("on",dtOpen)};
  setInterval(chk,600);window.addEventListener("resize",chk);chk();
}
if(tampered)toast("저장 데이터가 변조되어 초기화됐어요");
renderFilters();renderAll();renderPot();
})();
