const UP=[{n:'❤️ 체력',d:'최대 체력 +20',c:40},{n:'💪 공격력',d:'데미지 +10%',c:50},{n:'👟 이동속도',d:'이동 +6%',c:40},{n:'💰 골드 획득',d:'획득량 +15%',c:60}];

const RAR=[['D','#9aa0a6',1],['C','#5ad17a',1.05],['B','#4da6ff',1.1],['A','#c15bff',1.2],['S','#ffc400',1.3],['SS','#ff4d4d',1.5],['BIG','#ff7ad9',2]];

const WP={fries:{n:'🍟 감자튀김 회전',d:'몸 주위를 도는 감자튀김'},cola:{n:'🥤 콜라 오라',d:'주변 적에게 지속 데미지'}};
const SK={nova:{n:'💥 콜라 폭발',d:'광역 폭발 + 밀치기',cd:300},rain:{n:'☄️ 빅맥 레인',d:'적에게 빅맥 낙하',cd:360},shield:{n:'🧀 치즈 실드',d:'잠시 무적',cd:620}};
const PS={dm:{n:'💪 파워업',d:'데미지 +15%',f:()=>P.dm*=1.15},hp:{n:'🍩 든든한 배',d:'최대체력 +30, 회복',f:()=>{P.max+=30;P.hp=Math.min(P.max,P.hp+50)}},sp:{n:'👟 감튀 부스트',d:'이동속도 +10%',f:()=>P.spd*=1.1},mg:{n:'🧲 먹성 자석',d:'구슬 흡수 범위 +',f:()=>P.mag+=35}};
const TH=[['빅맥 초원','#2a5a2e','#0e2410','🌿','#7ddf64'],['감튀 사막','#7a5a1a','#2a1c06','🌵','#ffd56b'],['콜라 바다','#1a3a6a','#07142b','🫧','#5bb8ff'],['치즈 동굴','#6a5410','#241c04','🧀','#ffd34d'],['케첩 화산','#6a1a14','#240806','🌋','#ff6a4d'],['얼음 설원','#2a5a7a','#0b1d2b','❄️','#bfe8ff'],['야식 도시','#3a1a5a','#12081f','🌃','#d27bff'],['달빛 주방','#3a3a4a','#101018','🌙','#cfd6ff'],['67 우주','#1a1050','#05021a','⭐','#a98bff'],['황금 왕국','#7a5a00','#2a1d00','👑','#ffd700']];
const BTM=[900,2400,3900],BDELAY=900; // BDELAY: 보스가 죽은 뒤 다음 보스가 나오기까지 (60 = 1초, 900 = 15초)
const SH={n:['식스세븐~','6… 7!','🙌'],f:['6 7 6 7!','💨'],k:['식스세에븐!','6… 7…'],b:['6767676767!!','🔥','식스세븐!!!']};
let bname='',bdelay=0,toast='',toastT=0,afk=false,afkT=0,cutT=0,ip=0,md=false,S='lobby',P,E,B,G,F,D,X,t,ts,kills,lvl,xp,need,cards,boss,shake,f67,gain,stage,sel=1,bsp,bk,ct,pull=null,gm,
 tgt={x:W/2,y:H/2},mx=W/2,my=100,isT=false,aim=0,keys={},BT=[],lt=0;
const th=()=>TH[(stage-1)%10];
function newP(rg){const hp=120+25*SV.up[0];
  return {x:W/2,y:H/2,hp,max:hp,spd:2.2*(1+.06*SV.up[2]),dm:1+.1*SV.up[1],cd:0,inv:0,sh:0,mag:55,ang:0,ult:0,sz:1,rg:rg||0,sl:[],
   w:{main:1,fries:0,cola:0},s:{nova:0,rain:0,shield:0},sc:{nova:60,rain:60,shield:60},ps:{dm:0,hp:0,sp:0,mg:0}}}
function reset(){E=[];B=[];G=[];F=[];D=[];X=[];ts=0;lvl=1;xp=0;need=6;cards=null;boss=0;shake=0;f67=0;bsp=0;bk=0;bdelay=0;S='play'}
function init(){stage=sel;P=newP();t=0;kills=0;reset()}
function spawn(type,px,py){
  const sd=Math.random()*4|0;let x,y;
  if(sd==0){x=rnd(0,W);y=-30}else if(sd==1){x=W+30;y=rnd(0,H)}else if(sd==2){x=rnd(0,W);y=H+30}else{x=-30;y=rnd(0,H)}
  if(px!=null){x=px;y=py}
  const k=(1+.15*(stage-1))*(1+ts/7000),sp=1+Math.min(stage*.01,.4);
  const T={n:{hp:Math.ceil(2*k),r:15,s:(.6+ts/16000)*sp,d:5,c:'hsl('+((350+stage*13)%360)+',80%,60%)',tx:'67'},
    f:{hp:Math.ceil(k),r:11,s:(1.2+ts/18000)*sp,d:4,c:'#ffb703',tx:'6'},
    k:{hp:Math.ceil(8*k),r:22,s:.4*sp,d:9,c:'#8338ec',tx:'67'},
    b:{hp:140+stage*60,r:40+Math.min(stage,10),s:.45,d:14,c:'#d90429',tx:'6767',boss:1}}[type];
  const V=[0,0,0,0,'6767'];
  E.push({x,y,...T,mh:T.hp,fl:0,fc:0,em:V[0],e2:V[1],ox:V[2],oy:V[3],nm:V[4],ty:type});
}
function hit(e,d){e.hp-=d;e.fl=4;D.push({x:e.x+rnd(-8,8),y:e.y-e.r,v:d|0||1,l:30})}
function pool(all){
  const a=[],subs=(P.w.fries>0)+(P.w.cola>0),ow=Object.keys(P.s).filter(k=>P.s[k]).length;
  if(P.w.main<5)a.push({t:'주무기',c:'#ff7a45',n:MW[SV.eq].n+' 강화',d:'데미지·연사 상승',l:P.w.main,f:()=>P.w.main++});
  for(const k in WP){const l=P.w[k];if(l>=5||(l==0&&subs>=2))continue;a.push({t:'보조무기',c:'#ff9f45',n:WP[k].n,d:WP[k].d,l,f:()=>P.w[k]++})}
  for(const k in SK){const l=P.s[k];if(l>=5||(l==0&&ow>=2))continue;a.push({t:'스킬',c:'#35b8ff',n:SK[k].n,d:SK[k].d,l,f:()=>{if(!P.s[k])P.sl.push(k);P.s[k]++}})}
  for(const k in PS){const l=P.ps[k];if(l>=3)continue;a.push({t:'패시브',c:'#7bd44a',n:PS[k].n,d:PS[k].d,l,f:()=>{P.ps[k]++;PS[k].f()}})}
  a.sort(()=>Math.random()-.5);return all?a:a.slice(0,3);
}
function ring(x,y,R,c){X.push({x,y,r:0,R,l:22,c})}
function ult(){if(S!='play'||P.ult<100)return;P.ult=0;f67=50;shake=25;ring(P.x,P.y,420,'#ff3d7f');for(const e of E)hit(e,e.boss?50:60*P.dm)}
function fire(a){
  const m=MW[SV.eq],L=P.w.main,rm=RAR[m.r][2]*(1+.12*((SV.w[SV.eq]||1)-1))*(1+.22*(L-1))*P.dm,n=m.sh+(L>=5?1:0);
  for(let i=0;i<n;i++){
    const c=i-(n-1)/2;let o=a,x=P.x,y=P.y;
    if(m.omni)o=a+i*6.283/n;else if(m.par){x+=Math.cos(a+1.57)*c*11;y+=Math.sin(a+1.57)*c*11}else o=a+c*(m.sp||.2);
    if(m.jit)o+=rnd(-m.jit,m.jit);
    B.push({x,y,vx:Math.cos(o)*m.sd,vy:Math.sin(o)*m.sd,dmg:m.dmg*rm,p:m.pr,hit:new Set(),l:m.life||90,r:o,ex:m.ex,sz:m.sz||20,hm:m.hm,bn:m.bn})
  }
  P.cd=Math.max(m.rate<14?5:9,m.rate*(1-.06*(L-1)));
}
function saveRun(){if(S!='play'||!P)return;SV.run={stage,kills,t,lvl,xp,need,ts,bk,P};save()}
function resume(){const R=SV.run;if(!R)return;stage=R.stage;sel=stage;P=R.P;kills=R.kills;t=R.t;reset();lvl=R.lvl;xp=R.xp;need=R.need;ts=R.ts;bk=R.bk;bsp=R.bk;bdelay=R.bk>0?300:0}
function leave(){if(S!='play')return;saveRun();afk=false;S='lobby'}
function openChest(){
  let r=Math.random()*100,i=0;while(i<7&&r>=WW[i]){r-=WW[i];i++}
  const sg=6.283/8;WH={t:0,i,fin:6.283*6-(i*sg+sg/2+rnd(-.35,.35)*sg),lc:-1,ap:0,msg:''};S='wheel';beep(300,.1);
}
function grant(k){
  const gd=40+stage*8,pk=ty=>{const a=pool(1).filter(c=>c.t==ty||(ty=='무기'&&(c.t=='주무기'||c.t=='보조무기')));if(!a.length)return null;const c=a[Math.random()*a.length|0];c.f();return c.n};
  const G1=()=>{P.rg+=gd;return '💰 골드 +'+gd};
  if(k=='g1')return G1();
  if(k=='g3'){P.rg+=gd*3;return '💰💰 골드 대박 +'+gd*3}
  if(k=='hp'){P.hp=P.max;return '❤️ 체력 완전 회복!'}
  if(k=='ult'){P.ult=100;return '⚡ 필살기 충전 완료!'}
  if(k=='wp'){const n=pk('무기');return n?'⚔️ '+n+' 강화!':G1()}
  if(k=='sk'){const n=pk('스킬');return n?'✨ '+n+' 획득!':G1()}
  if(k=='ps'){const n=pk('패시브');return n?'🧲 '+n+' 획득!':G1()}
  const a=pk('무기'),b=pk('스킬');P.rg+=gd*2;return '👑 잭팟! 💰+'+gd*2+(a?' · '+a:'')+(b?' · '+b:'');
}
function cast(i){const k=P.sl[i];if(S!='play'||!k||P.sc[k]>0)return;const L=P.s[k];
 if(k=='nova'){const R=110+L*15;ring(P.x,P.y,R,'#35b8ff');shake=10;for(const e of E){const dd=Math.hypot(e.x-P.x,e.y-P.y)||1;if(dd<R+e.r){hit(e,(8+L*5)*P.dm);if(!e.boss){e.x+=(e.x-P.x)/dd*45;e.y+=(e.y-P.y)/dd*45}}}}
 else if(k=='rain'){[...E].sort(()=>Math.random()-.5).slice(0,4+L*2).forEach(e=>{hit(e,(10+L*5)*P.dm);X.push({x:e.x,y:e.y,l:25,em:1})});shake=6}
 else P.sh=120+L*30;
 P.sc[k]=SK[k].cd-L*30}
function step(){
  t++;ts++;if(t%300==0)saveRun();
  let dx=0,dy=0;
  if(keys.arrowleft||keys.a)dx--;if(keys.arrowright||keys.d)dx++;if(keys.arrowup||keys.w)dy--;if(keys.arrowdown||keys.s)dy++;
  if(dx||dy){const l=Math.hypot(dx,dy);P.x+=dx/l*P.spd;P.y+=dy/l*P.spd;tgt.x=P.x;tgt.y=P.y}
  else if(isT){const ax=tgt.x-P.x,ay=tgt.y-P.y,d=Math.hypot(ax,ay);if(d>6){const m=Math.min(P.spd,d);P.x+=ax/d*m;P.y+=ay/d*m}}
  P.x=Math.max(24,Math.min(W-24,P.x));P.y=Math.max(44,Math.min(H-70,P.y));
  if(P.inv>0)P.inv--;if(P.sh>0)P.sh--;
  const gap=Math.max(20,Math.floor(75-ts/110-stage*.4));
  if(ts%gap==0){const r=Math.random();spawn((ts>1500||stage>2)&&r<.16?'k':r<.4?'f':'n')}
  // 보스: 앞 보스가 죽어야 다음 보스 등장 + 죽고 나서 BDELAY(15초) 뒤에 등장
  if(bdelay>0)bdelay--;
  if(bsp<3&&!E.some(e=>e.boss)&&(bsp==0?ts>=BTM[0]:bdelay<=0)){spawn('b');bsp++;boss=120;bname=E[E.length-1].nm}
  if(boss>0)boss--;
  for(const e of E)if(e.boss&&ts%420==0){spawn('f',e.x+20,e.y);spawn('f',e.x-20,e.y)}
  // 조준
  let nr=null,nd=1e9;for(const e of E){const q=(e.x-P.x)**2+(e.y-P.y)**2;if(q<nd){nd=q;nr=e}}
  if(isT){if(nr)aim=Math.atan2(nr.y-P.y,nr.x-P.x)}else aim=Math.atan2(my-P.y,mx-P.x);
  P.cd--;if(P.cd<=0&&(!isT||nr))fire(aim);
  for(const b of B){
    if(b.hm){let n=null,nd=2e4;for(const e of E){const q=(e.x-b.x)**2+(e.y-b.y)**2;if(q<nd){nd=q;n=e}}
      if(n){const sp=Math.hypot(b.vx,b.vy),ta=Math.atan2(n.y-b.y,n.x-b.x);let ca=Math.atan2(b.vy,b.vx),d=ta-ca;while(d>3.14)d-=6.283;while(d<-3.14)d+=6.283;ca+=Math.max(-.12,Math.min(.12,d));b.vx=Math.cos(ca)*sp;b.vy=Math.sin(ca)*sp;b.r=ca}}
    b.x+=b.vx;b.y+=b.vy;b.l--;
    if(b.bn){let bo=0;if(b.x<0||b.x>W){b.vx*=-1;b.x=Math.max(0,Math.min(W,b.x));bo=1}if(b.y<24||b.y>H){b.vy*=-1;b.y=Math.max(24,Math.min(H,b.y));bo=1}if(bo){b.hit.clear();b.r=Math.atan2(b.vy,b.vx)}}}
  P.ang+=.06;
  if(P.w.fries){const n=P.w.fries+1;for(let i=0;i<n;i++){const fx=P.x+Math.cos(P.ang+i*6.283/n)*58,fy=P.y+Math.sin(P.ang+i*6.283/n)*58;
    for(const e of E)if(e.fc<=0&&Math.hypot(fx-e.x,fy-e.y)<e.r+10){hit(e,(1.5+P.w.fries*.7)*P.dm);e.fc=14}}}
  if(P.w.cola&&t%20==0)for(const e of E)if(Math.hypot(e.x-P.x,e.y-P.y)<40+P.w.cola*12+e.r)hit(e,P.w.cola*1.4*P.dm);
  for(const k in P.sc)if(P.sc[k]>0)P.sc[k]--;
  for(const e of E){
    const a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.s;e.y+=Math.sin(a)*e.s;if(e.fl>0)e.fl--;e.fc--;if(Math.random()<(e.boss?.004:.0006)){const q=SH[e.ty];D.push({x:e.x,y:e.y-e.r-10,v:q[Math.random()*q.length|0],l:70})}
    for(const b of B)if(b.p>0&&!b.hit.has(e)&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+10){
      b.hit.add(e);b.p--;hit(e,b.dmg);if(!e.boss){e.x-=Math.cos(a)*3;e.y-=Math.sin(a)*3}
      if(b.ex){b.p=0;ring(b.x,b.y,b.ex,'#ff8a3d');shake=6;for(const o of E)if(o!=e&&Math.hypot(o.x-b.x,o.y-b.y)<b.ex+o.r)hit(o,b.dmg*.7)}}
    if(!P.inv&&!P.sh&&Math.hypot(P.x-e.x,P.y-e.y)<e.r+22){P.hp-=e.d;P.inv=40;shake=8;if(P.hp<=0)die()}
  }
  B=B.filter(b=>b.p>0&&b.l>0&&b.x>-40&&b.x<W+40&&b.y>-40&&b.y<H+40);
  for(const e of E)if(e.hp<=0){e.dead=1;kills++;P.ult=Math.min(100,P.ult+(e.boss?30:1.8));
    G.push({x:e.x,y:e.y,v:e.boss?12:1});if(Math.random()<.05)G.push({x:e.x+8,y:e.y,v:0,h:1});
    for(let i=0;i<6;i++)F.push({x:e.x,y:e.y,vx:rnd(-3,3),vy:rnd(-3,3),l:20,c:e.c});
    if(e.boss){shake=20;bk++;bdelay=BDELAY;P.rg+=60;G.push({x:e.x,y:e.y,v:0,c:1})}}
  E=E.filter(e=>!e.dead);
  for(const q of G){const dd=Math.hypot(P.x-q.x,P.y-q.y)||1;if(q.c&&dd>=P.mag){q.x+=(P.x-q.x)/dd*2.2;q.y+=(P.y-q.y)/dd*2.2}if(dd<P.mag){q.x+=(P.x-q.x)/dd*4.5;q.y+=(P.y-q.y)/dd*4.5}

function drawE(e){
  const r=e.r,ty=e.ty,sp={n:.16,f:.3,k:.12,b:.22}[ty]||.16,bob=Math.sin(lt/6+e.x*.05)*1.5,lk=Math.sin(lt*sp+e.x*.1),skin='#ffd9a8';
  g.save();g.translate(e.x,e.y+bob);g.lineCap='round';
  for(const sd of[-1,1]){
    const hy=(sd<0?lk:-lk)*r*.6-r*.05,hx=sd*r*1.2;
    g.strokeStyle=skin;g.lineWidth=r*.3;g.beginPath();g.moveTo(sd*r*.75,r*.2);g.lineTo(hx,hy);g.stroke();
    g.fillStyle=skin;g.beginPath();g.arc(hx,hy,r*.32,0,7);g.fill();
    for(let i=-1;i<=1;i++){g.beginPath();g.arc(hx+i*r*.15,hy-r*.3,r*.11,0,7);g.fill()}
  }
  g.fillStyle=e.c;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.strokeStyle='#0005';g.lineWidth=2;g.stroke();
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  for(const sx of[-1,1]){const er=r*(sx>0?.3:.22);g.fillStyle='#fff';g.beginPath();g.arc(sx*r*.34,-r*.15,er,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(sx*r*.34+dx/d*er*.35,-r*.15+dy/d*er*.35,er*.45,0,7);g.fill()}
  g.fillStyle='#3a0a0a';g.beginPath();g.ellipse(0,r*.4,r*.3,r*(.14+.08*Math.abs(lk)),0,0,7);g.fill();
  g.fillStyle='#ff7a8a';g.beginPath();g.ellipse(0,r*.5,r*.14,r*.07,0,0,7);g.fill();
  if(e.boss||ty=='k'){g.strokeStyle='#000';g.lineWidth=r*.07;g.beginPath();g.moveTo(-r*.6,-r*.5);g.lineTo(-r*.12,-r*.38);g.moveTo(r*.6,-r*.5);g.lineTo(r*.12,-r*.38);g.stroke()}
  if(e.boss)em('👑',0,-r*1.05,r*.9,0);
  if(e.fl){g.globalAlpha=.6;g.fillStyle='#fff';g.beginPath();g.arc(0,0,r,0,7);g.fill();g.globalAlpha=1}
  g.restore();
}
let WH;const WS=[['💰','골드'],['👑','잭팟'],['⚔️','무기'],['💰💰','대박'],['❤️','회복'],['✨','스킬'],['⚡','필살기'],['🧲','패시브']],WK=['g1','jp','wp','g3','hp','sk','ult','ps'],WG=[0,1,0,1,0,1,0,0],WC=['#3a86c8','#c14a3a','#3aa860','#7a4ac8','#3a9aa8'],WW=[20,4,16,8,14,16,12,10];
function wheelScr(){
  const w=WH;w.t++;const u=Math.min(1,w.t/260),ez=1-Math.pow(1-u,4),th=w.fin*ez,sg=6.283/8,cx=W/2,cy=285,R=135,done=u>=1;

  const ci=Math.floor(th/sg);if(ci!=w.lc){w.lc=ci;if(!done)beep(480+(ci%8)*30,.04)}

  g.save();g.translate(cx,cy);g.rotate(th);
  for(let i=0;i<8;i++){const a0=i*sg-1.5708,a1=a0+sg,win=done&&i==w.i;
    g.beginPath();g.moveTo(0,0);g.arc(0,0,R,a0,a1);g.closePath();
    g.fillStyle=WG[i]?'#e8b820':WC[i%5];g.fill();
    if(WG[i]){g.fillStyle='rgba(255,255,200,'+(.18+.18*Math.sin(lt/5+i))+')';g.fill()}
    g.strokeStyle=win?'#fff':'#0008';g.lineWidth=win?6:2;g.stroke();
    g.save();g.rotate(a0+sg/2);em(WS[i][0],R*.74,0,i==3?20:26,1.5708);g.save();g.translate(R*.42,0);g.rotate(1.5708);txt(WS[i][1],0,0,12,WG[i]?'#4a2e00':'#fff');g.restore();g.restore()}
  g.restore();
  g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,16,0,7);g.fill();
  g.fillStyle='#ff3d7f';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(cx-15,cy-R-22);g.lineTo(cx+15,cy-R-22);g.lineTo(cx,cy-R+8);g.closePath();g.fill();g.stroke();
  if(done&&!w.ap){w.ap=1;w.msg=grant(WK[w.i]);beep(660,.15,.07);setTimeout(()=>beep(880,.2,.07),140);if(WG[w.i])setTimeout(()=>beep(1175,.35,.08),300)}
  if(done){txt(w.msg,W/2,462,15,'#ffd34d');if(w.t>285)txt('화면을 탭해서 계속',W/2,510,13,'#aaa')}

}
