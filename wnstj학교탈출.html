.scn{position:absolute;inset:0;overflow:hidden;transition:background .8s}
.act{position:absolute;transform:translate(-50%,-50%);line-height:1}
.act i{display:block;font-style:normal}
.act i.fat{transform:scaleX(1.4)}
.act b{display:block;font-weight:400}
.an-bob{animation:bob 1.1s ease-in-out infinite}
.an-float{animation:float 2.4s ease-in-out infinite}
.an-shake{animation:shk .18s linear infinite}
.an-zoom{animation:zm 5s ease-out forwards}
.an-pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.an-inR{animation:inR 1.8s ease-out both}
.an-inL{animation:inL 1.8s ease-out both}
.an-sweep{transform-origin:50% 0;animation:sweep 2.6s ease-in-out infinite alternate}
.an-spin{animation:spin 1.6s linear infinite}
@keyframes bob{50%{transform:translateY(-8%)}}
@keyframes float{50%{transform:translateY(-18%);opacity:.6}}
@keyframes shk{0%{transform:translate(-2%,1%)}50%{transform:translate(2%,-1%)}100%{transform:translate(-2%,1%)}}
@keyframes zm{from{transform:scale(.7)}to{transform:scale(1.25)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes inR{from{transform:translateX(-260%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(260%);opacity:0}to{transform:none;opacity:1}}
@keyframes sweep{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fx-zoom{animation:cz 7s linear forwards}
.fx-pan{animation:cp 7s linear forwards}
.fx-shake{animation:cs .2s linear infinite}
@keyframes cz{from{transform:scale(1)}to{transform:scale(1.18)}}
@keyframes cp{from{transform:translateX(3%) scale(1.08)}to{transform:translateX(-3%) scale(1.08)}}
@keyframes cs{0%{transform:translate(-1%,.5%)}50%{transform:translate(1%,-.5%)}100%{transform:translate(-1%,.5%)}}
.ttl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:Jua,sans-serif;font-size:10cqw;animation:pop 1s both}
.letter{position:absolute;left:0;right:0;height:11%;background:#000;z-index:3;animation:lb 1s ease-out both}

.hold{position:absolute;right:8px;top:8px;z-index:5;border:0;border-radius:14px;background:#0009;color:#fff;font:inherit;font-size:12px;padding:3px 12px;cursor:pointer;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff55}
.hold.on i{width:100%;transition:width 1.2s linear}
.hold span{position:relative}
@media (prefers-reduced-motion:reduce){.act b,.act i,.fx-zoom,.fx-pan,.fx-shake,.ttl{animation:none!important}.bar i{transition:none}}

e_hole:["🕳️","개구멍 엔딩","머리는 나갔다. 어깨도 나갔다. 배가 안 나간다. 오늘의 교훈: 개구멍은 구멍의 크기를 먼저 보라는 뜻이다."]

const W="🧑‍🎓";
let st,found=new Set(),seenIntro=false,stop=null;
try{JSON.parse(localStorage.getItem("wnstjDex")||"[]").forEach(k=>found.add(k))}catch(e){}
const $=id=>document.getElementById(id);
const cl=v=>Math.max(0,Math.min(100,v));
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;

function start(){
 st={e:100,h:45+Math.floor(Math.random()*16),r:0,f:{},bm:0};
 bars();
 if(seenIntro)return show("c1");
 seenIntro=true;
 cut(CUT.c1,()=>show("c1"));
}
function bars(){
 const d=[["체력",st.e,"var(--exit)"],["허기",st.h,"var(--tray)"],["위험",st.r,"var(--alarm)"]];
 $("stats").innerHTML=d.map(a=>`<div class="stat">${a[0]} ${a[1]}<div class="bar"><i style="width:${a[1]}%;background:${a[2]}"></i></div></div>`).join("");
 const it=Object.keys(N).filter(k=>st.f[k]);
 $("inv").innerHTML=it.length?"소지품 "+it.map(k=>`<b>${N[k]}</b>`).join(""):"소지품 없음";
}
// ===== 시네마틱 컷신 엔진: 자동 재생, 클릭해도 넘어가지 않음. 우상단 버튼을 1.2초 꾹 눌러야 건너뜀 =====
function cut(shots,done){
 if(stop)stop();
 const card=$("card");card.className="card cin";
 card.innerHTML=`<div class="stage"><div class="scn" id="scn"></div><div class="letter tp"></div><div class="letter bt"></div><div class="sub" id="sub"></div><button class="hold" id="hold" aria-label="1.2초 꾹 눌러 컷신 건너뛰기"><i></i><span>꾹 눌러 건너뛰기</span></button></div>`;
 const scn=$("scn"),sub=$("sub"),hold=$("hold");
 let i=0,fin=false,tm=null,ty=null,hd=null;
 const end=()=>{if(fin)return;fin=true;clearTimeout(tm);clearInterval(ty);clearTimeout(hd);stop=null;card.className="card";done()};
 stop=()=>{fin=true;clearTimeout(tm);clearInterval(ty);clearTimeout(hd);stop=null};
 const down=()=>{if(hd)return;hold.classList.add("on");hd=setTimeout(end,1200)};
 const up=()=>{clearTimeout(hd);hd=null;hold.classList.remove("on")};
 hold.addEventListener("pointerdown",down);
 ["pointerup","pointerleave","pointercancel","blur"].forEach(n=>hold.addEventListener(n,up));
 hold.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!e.repeat)down()});
 hold.addEventListener("keyup",up);
 const next=()=>{
  if(i>=shots.length){tm=setTimeout(end,700);return}
  const [bg,txt,acts,fx]=shots[i++];
  scn.className="scn";void scn.offsetWidth;
  scn.style.background=BG[bg]||bg;
  scn.className="scn"+(fx?" fx-"+fx:"");
  if(bg==="title"){scn.innerHTML=`<div class="ttl">${txt}</div>`;sub.textContent="";tm=setTimeout(next,3200);return}
  scn.innerHTML=acts.map(a=>{
   const w=a[0]==="W";
   return `<span class="act" style="left:${a[1]}%;top:${a[2]}%;font-size:${a[3]}cqw"><i class="${w?"fat":""}"><b class="an-${a[4]}">${w?W:a[0]}</b></i></span>`;
  }).join("");
  clearInterval(ty);
  if(reduce){sub.textContent=txt}
  else{let n=0;sub.textContent="";ty=setInterval(()=>{n++;sub.textContent=txt.slice(0,n);if(n>=txt.length)clearInterval(ty)},48)}
  tm=setTimeout(next,Math.max(2600,txt.length*48+1700));
 };
 next();
}
function bmShots(l){
 const a=[["cafe",l[0],[["🍔",50,50,30,"zoom"]],"zoom"]];
 l.slice(1,-1).forEach(t=>a.push(["cafe",t,[["W",36,66,24,"shake"],["🍔",66,56,14,"bob"]],"shake"]));
 a.push(["cafe",l[l.length-1],[["W",50,66,26,"bob"],["💨",70,42,10,"float"],["😋",58,36,9,"pop"]],"zoom"]);
 return a;
}
function route(to){
 if(!E[to]){
  if(st.h>=100||st.e<=0)to="e_faint";
  else if(st.r>=100)to="e_caught";
  else if(st.h<=0)to="e_food";
 }
 show(to);
}
function show(id){
 bars();
 if(E[id])return cut(CUT[id]||[],()=>endCard(id));
 const b=BM[id];
 if(b&&!st.f["bm_"+id]){
  st.f["bm_"+id]=1;st.bm++;
  st.h=cl(st.h-b.h);st.e=cl(st.e+10);st.r=cl(st.r+b.r);bars();
  return cut(bmShots(b.l),()=>{if(st.bm>=3)show("e_bigmac");else route(id)});
 }
 if(CUT[id]&&!st.f["c_"+id]){st.f["c_"+id]=1;return cut(CUT[id],()=>show(id))}
 render(id);
}
function endCard(id){
 found.add(id);
 try{localStorage.setItem("wnstjDex",JSON.stringify([...found]))}catch(e){}
 const x=E[id],c=$("card");
 c.innerHTML=`<div class="end"><div class="em">${x[0]}</div><h2 class="place">${x[1]}</h2><p class="txt">${x[2]}</p><div class="dex">엔딩 도감 ${found.size} / ${Object.keys(E).length}</div><button class="c" id="again">처음부터 다시 도전</button></div>`;
 $("again").onclick=start;
}
function render(id){
 bars();
 const s=S[id],c=$("card");
 c.innerHTML=`<h2 class="place">${s[0]}</h2><p class="txt">${s[1]}</p><div id="ch"></div>`;
 s[2].forEach(ch=>{
  const o=ch[2]||{};
  const lock=o.n&&!st.f[o.n];
  const b=document.createElement("button");
  b.className="c";
  b.textContent=lock?`🔒 ${ch[0]} (필요: ${N[o.n]})`:ch[0];
  b.disabled=!!lock;
  b.onclick=()=>pick(ch);
  $("ch").appendChild(b);
 });
}
function pick(ch){
 const o=ch[2]||{};let to=ch[1];
 st.e=cl(st.e+(o.e||0));st.h=cl(st.h+(o.h||0)+3);st.r=cl(st.r+(o.r||0));
 const fail=(o.p&&Math.random()>o.p)||(o.m&&st.e<o.m);
 if(fail)to=o.f;
 else{if(o.u)delete st.f[o.u];[].concat(o.g||[]).forEach(k=>st.f[k]=1)}
 route(to);
}
start();
